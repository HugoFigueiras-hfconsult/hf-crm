<meta charset="utf-8">
<title>Mandanten-Artefakt Vorlage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Mandanten-Artefakt (Vorlage mit erfundenen Testdaten). Beschreibung: dashboard/README.md, Spezifikation: docs/10-mandanten-artefakt.md
  Aufbau dieser Datei: 1. Gestaltung (CSS)  2. Gerüst (HTML)  3. Skript: DATEN, RECHT, RECHENKERN, HELFER, FOLIEN, BÜHNE
  Je Mandant tauscht der Agent nur das Objekt DATEN (und den Titel oben). Kein Netzwerkzugriff, keine fremden Bibliotheken.
-->
<style>
:root{
  /* Layout: Bühne im Querformat. Oben der Kopf, in der Mitte die Folie, unten der Fortschritt.
     Farbe trägt nur Bedeutung (drei Töpfe, vier Bereiche). Die Bedienung bleibt einfarbig in Tinte. */
  --bg:#EEF1F4; --flaeche:#FFFFFF; --flaeche-2:#F4F6F8; --tinte:#101A24; --tinte-2:#44525F; --tinte-3:#5E6B77; --umkehr:#FFFFFF;
  --linie:#DCE2E8; --linie-2:#C2CBD4;
  --kurz:#E3A008; --mittel:#0FA68E; --lang:#2B6FD6;                              /* Töpfe */
  --gesundheit:#D8508C; --basisrisiken:#2E9442; --einkommen:#6D56D8; --wohnen:#C8553D;   /* Bereiche */
  --leben:#8494A6; --abzug:#56636F; --abzug-2:#A4AFBA; --erledigt:#1F8A3D; --auf-leben:#101A24;
  --schatten:0 1px 2px rgba(16,26,36,.05),0 12px 32px rgba(16,26,36,.08);
  --f-titel:"Inter Display","Segoe UI Variable Display","SF Pro Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-text:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:.8rem; --r-s:.5rem; --kurve:cubic-bezier(.22,.7,.2,1);
  --rand-l:max(16px,env(safe-area-inset-left,0px),3vw); --rand-r:max(16px,env(safe-area-inset-right,0px),3vw);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1217; --flaeche:#161D24; --flaeche-2:#1C2630; --tinte:#EAF0F4; --tinte-2:#B3BEC8; --tinte-3:#8F9BA7; --umkehr:#0D1217;
  --linie:#27323C; --linie-2:#3A4855;
  --kurz:#C98F0A; --mittel:#12A890; --lang:#4A8DF0; --gesundheit:#E0619A; --basisrisiken:#3DAE55; --einkommen:#9585F0; --wohnen:#D4504A;
  --leben:#7C8EA3; --abzug:#9AA6B2; --abzug-2:#566370; --erledigt:#4CC26B; --auf-leben:#0D1217;
  --schatten:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1217; --flaeche:#161D24; --flaeche-2:#1C2630; --tinte:#EAF0F4; --tinte-2:#B3BEC8; --tinte-3:#8F9BA7; --umkehr:#0D1217;
  --linie:#27323C; --linie-2:#3A4855;
  --kurz:#C98F0A; --mittel:#12A890; --lang:#4A8DF0; --gesundheit:#E0619A; --basisrisiken:#3DAE55; --einkommen:#9585F0; --wohnen:#D4504A;
  --leben:#7C8EA3; --abzug:#9AA6B2; --abzug-2:#566370; --erledigt:#4CC26B; --auf-leben:#0D1217;
  --schatten:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4); color-scheme:dark}

/* ---------- Grundlagen ---------- */
html{height:100%;font-size:clamp(12.5px,min(1.04vw,1.86vh),22px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tinte);font:400 1rem/1.45 var(--f-text);-webkit-font-smoothing:antialiased;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,p,ul,ol,figure{margin:0} ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lang);outline-offset:2px}
i,em,u,cite{font-style:normal;text-decoration:none}
small{font-size:.8rem;color:var(--tinte-2);font-weight:400}
.etikett{font-size:.72rem;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--tinte-3)}
.klein{font-size:.82rem;color:var(--tinte-2)}
.leer{color:var(--tinte-3);font-size:.9rem}
.zahl{font-variant-numeric:tabular-nums}
.zahl-gross{font:600 2.3rem/1.05 var(--f-titel);letter-spacing:-.02em}
.zahl-gross small{font:400 .82rem/1.3 var(--f-text);letter-spacing:0}
.punkt{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:var(--f);margin-right:.5rem;flex:none}
.dreifarb{display:inline-flex;width:1.5rem;height:.7rem;gap:1px;margin-right:.5rem;vertical-align:baseline;flex:none}
.dreifarb i{flex:1 1 0;background:var(--f);border-radius:1px 1px 3px 3px}
.topfmarke{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.topfmarke::before{content:"";width:.75rem;height:.8rem;background:var(--tf);border-radius:1px 1px 4px 4px}
.fazit{font-size:1.05rem;max-width:100ch;text-wrap:pretty}
.annahmen{font-size:.8rem;color:var(--tinte-2);line-height:1.4} .annahmen b{color:var(--tinte)}
.annahmen ul{padding-left:1rem;list-style:disc;margin-top:.3rem;columns:2;column-gap:2.4rem} .annahmen li{break-inside:avoid;margin-bottom:.25rem}
@keyframes ein{from{opacity:0;transform:translateY(.6rem)}}
@keyframes wachs{from{transform:scaleX(0)}}
@keyframes zieh{to{stroke-dashoffset:0}}
@keyframes blend{from{opacity:0}}
@keyframes aufdecken{from{clip-path:inset(-1rem 100% -1rem -1rem)}to{clip-path:inset(-1rem -1rem -1rem -1rem)}}
.ein{animation:ein .55s var(--kurve) backwards;animation-delay:calc(var(--i,0)*70ms)}
.ruhig *,.ruhig *::before,.ruhig *::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important;transition-delay:0s!important}

/* ---------- Gerüst: Kopf, Bühne, Fuß ---------- */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.kopf{display:flex;align-items:center;gap:.9rem;padding-block:.5rem;padding-left:var(--rand-l);padding-right:var(--rand-r);border-bottom:1px solid var(--linie)}
.marke{display:inline-flex;align-items:center;gap:.6rem;background:none;border:0;padding:.3rem .2rem;font:650 1.05rem var(--f-titel);border-radius:var(--r-s);min-width:0}
#kopf-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeichen{display:inline-flex;align-items:flex-end;gap:2px;height:1.15rem}
.zeichen i{width:.34rem;border-radius:1px 1px 3px 3px}
.zeichen i:nth-child(1){height:55%;background:var(--kurz)} .zeichen i:nth-child(2){height:100%;background:var(--mittel)} .zeichen i:nth-child(3){height:78%;background:var(--lang)}
.pille{font-size:.68rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .5rem;border:1px solid var(--linie-2);border-radius:99px;color:var(--tinte-3);white-space:nowrap}
.kopf-kapitel{color:var(--tinte-3);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.werkzeug{margin-left:auto;display:flex;align-items:center;gap:.4rem}
.wz{display:inline-flex;align-items:center;gap:.45rem;height:2.2rem;padding:0 .8rem;border:1px solid transparent;border-radius:99px;background:none;font-size:.85rem;font-weight:550;white-space:nowrap}
.wz:hover{border-color:var(--linie-2);background:var(--flaeche)} .wz svg{width:1.05rem;height:1.05rem;flex:none}
.schalter{cursor:pointer;position:relative} .schalter input{position:absolute;opacity:0;width:0;height:0}
.schalter i{width:2rem;height:1.15rem;border-radius:99px;background:var(--linie-2);position:relative;transition:background .25s;flex:none}
.schalter i::after{content:"";position:absolute;top:2px;left:2px;width:calc(1.15rem - 4px);height:calc(1.15rem - 4px);border-radius:50%;background:var(--flaeche);transition:transform .25s}
.schalter input:checked+i{background:var(--tinte)} .schalter input:checked+i::after{transform:translateX(.85rem)}
.schalter input:focus-visible+i{outline:3px solid var(--lang);outline-offset:2px}
.buehne{overflow:hidden auto;position:relative} #folien{height:100%}
.folie{min-height:100%;max-width:104rem;margin-inline:auto;display:flex;flex-direction:column;gap:1.1rem;padding-block:1.3rem 1.1rem;padding-left:var(--rand-l);padding-right:var(--rand-r);animation:ein .45s var(--kurve) backwards}
.folie-kopf{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem 2rem;flex-wrap:wrap}
.folie-kopf h1{font:600 2.3rem/1.1 var(--f-titel);letter-spacing:-.022em;text-wrap:balance;margin-top:.25rem}
.lead{font-size:1.05rem;color:var(--tinte-2);max-width:88ch;margin-top:.4rem;text-wrap:pretty}
.stufen,.wahl{display:inline-flex;padding:.2rem;border:1px solid var(--linie-2);border-radius:99px;background:var(--flaeche);flex:none}
.stufen button,.wahl button{border:0;background:none;padding:.5rem 1.1rem;border-radius:99px;font-weight:600;font-size:.95rem;transition:background .25s,color .25s;white-space:nowrap}
.stufen button[aria-pressed="true"],.wahl button[aria-pressed="true"]{background:var(--tinte);color:var(--umkehr)}
.wahl{align-self:flex-start} .wahl button{padding:.35rem .8rem;font-size:.78rem}
.leise{background:none;border:0;padding:.2rem 0;font-size:.8rem;color:var(--tinte-2);text-decoration:underline;text-underline-offset:.2em;align-self:flex-start}
.fuss{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:.9rem;align-items:center;padding-block:.5rem;padding-left:var(--rand-l);padding-right:var(--rand-r);border-top:1px solid var(--linie)}
.nav{height:2.5rem;min-width:2.5rem;padding:0 1.1rem;border-radius:99px;border:1px solid var(--linie-2);background:var(--flaeche);font-weight:650;white-space:nowrap}
.nav:disabled{opacity:.35;cursor:default} .nav.weiter{background:var(--tinte);color:var(--umkehr);border-color:var(--tinte)}
.fortschritt{display:flex;gap:3px}
.fp{flex:1 1 0;height:1.2rem;padding:0;border:0;background:none;display:flex;align-items:center;min-width:0}
.fp i{width:100%;height:.28rem;border-radius:99px;background:var(--linie-2);transition:background .3s,height .3s}
.fp.neu{margin-left:.4rem} .fp.war i{background:var(--tinte-3)} .fp.jetzt i{background:var(--tinte);height:.55rem}
.fuss-text{display:flex;justify-content:space-between;gap:1rem;font-size:.72rem;color:var(--tinte-3)}
#btn-praes-aus,#fuss-test{display:none}
.praes .kopf{display:none} .praes .fuss{border-top-color:transparent} .praes #btn-praes-aus{display:inline-flex} .praes #fuss-test:not([hidden]){display:inline-block}
#zoom{position:fixed;z-index:40;background:var(--flaeche);border:1px solid var(--linie-2);border-radius:var(--r);pointer-events:none;box-shadow:var(--schatten);overflow:hidden}
.zoom-inhalt{display:flex;flex-direction:column;gap:.2rem;padding:.9rem 1.05rem 1rem;width:100%;height:100%;min-width:15rem}
#tipp{position:fixed;z-index:50;background:var(--tinte);color:var(--umkehr);padding:.5rem .7rem;border-radius:var(--r-s);font-size:.8rem;pointer-events:none;box-shadow:var(--schatten);max-width:18rem}
.tipp-titel{opacity:.7;margin-bottom:.2rem} .tipp-zeile{display:flex;align-items:center;gap:.45rem} .tipp-zeile i{width:.9rem;height:3px;border-radius:2px;flex:none} .tipp-zeile span{opacity:.75}

/* ---------- Diagramme, Regler, wiederkehrende Teile ---------- */
.chart{display:block;overflow:visible}
.gitter{stroke:var(--linie);stroke-width:1} .grundlinie{stroke:var(--linie-2);stroke-width:1} .faden{stroke:var(--tinte-3);stroke-width:1} .fuehrung{stroke:var(--tinte-3);stroke-width:1}
.achse{font-size:.72rem;fill:var(--tinte-3);font-variant-numeric:tabular-nums}
.linie{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round} .linie.strich{stroke-width:2;stroke-dasharray:1 6}
.band{opacity:.15} .flaeche{opacity:.1}
.zieh{stroke-dasharray:1;stroke-dashoffset:1;animation:zieh 1.1s var(--kurve) forwards}
.blend{animation:blend .5s ease backwards;animation-delay:.85s}
.marke-text{font-size:.72rem;font-weight:700;fill:var(--tinte)} .ende-wert{font-size:.95rem;font-weight:700;fill:var(--tinte)} .ende-name{font-size:.72rem;fill:var(--tinte-2)}
.legende{display:flex;flex-wrap:wrap;gap:.3rem 1.3rem;font-size:.8rem;color:var(--tinte-2)}
.legende li{display:flex;align-items:center;gap:.45rem}
.legende i,.rl-leg i{flex:none;width:1.1rem;height:3px;border-radius:2px;background:var(--f)}
.legende i.punkte{background:none;border-top:3px dotted var(--f);height:0} .legende i.feld{height:.7rem;opacity:.25;border-radius:2px}
.regler{display:flex;flex-direction:column;gap:.1rem;min-width:0;--rf:var(--tinte)} .regler.f-kurz{--rf:var(--kurz)} .regler.f-mittel{--rf:var(--mittel)} .regler.f-lang{--rf:var(--lang)}
.regler label{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;font-size:.88rem;font-weight:550}
.regler output{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.6rem;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:.36rem;border-radius:99px;background:var(--linie-2)}
input[type=range]::-moz-range-track{height:.36rem;border-radius:99px;background:var(--linie-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.3rem;height:1.3rem;margin-top:-.47rem;border-radius:50%;background:var(--rf);border:3px solid var(--flaeche);box-shadow:0 0 0 1px var(--linie-2)}
input[type=range]::-moz-range-thumb{width:1.3rem;height:1.3rem;border-radius:50%;background:var(--rf);border:3px solid var(--flaeche);box-shadow:0 0 0 1px var(--linie-2)}
.reglerstapel{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.8rem 1rem .6rem;display:flex;flex-direction:column;gap:.45rem}
.seite{display:flex;flex-direction:column;gap:.75rem;min-width:0}
.kz{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.8rem 1rem;min-width:0}
.kz-name{font-size:.88rem;font-weight:600;display:flex;align-items:center;margin-bottom:.35rem}
.fakten{background:var(--flaeche-2);border-radius:var(--r);padding:.75rem 1rem;font-size:.84rem;color:var(--tinte-2)}
.fakten ul{display:flex;flex-direction:column;gap:.4rem;margin-top:.35rem}
.fakten cite{font-style:normal;font-size:.7rem;color:var(--tinte-3);border:1px solid var(--linie-2);border-radius:99px;padding:0 .4rem;white-space:nowrap}

/* ---------- Startseite ---------- */
.start-titel{font:600 3.4rem/1.02 var(--f-titel);letter-spacing:-.03em;margin-top:.3rem}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));grid-auto-rows:1fr;gap:.85rem;margin-top:.4rem;flex:1;max-height:38rem}
.kachel{display:flex;flex-direction:column;gap:.2rem;text-align:left;background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.9rem 1.05rem 1rem;min-height:8.3rem;transition:border-color .2s,transform .2s,box-shadow .2s}
.kachel:hover{border-color:var(--tinte-3);transform:translateY(-2px);box-shadow:var(--schatten)}
.kachel-oben{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:auto;padding-bottom:.6rem}
.kachel-nr{display:grid;place-items:center;min-width:1.7rem;height:1.7rem;border:1px solid var(--linie-2);border-radius:99px;font-size:.8rem;font-weight:700;color:var(--tinte-2)} .kachel-nr:empty{visibility:hidden}
.kachel-bild svg{width:5.6rem;height:3.4rem;display:block}
.kachel-titel{font:650 1.25rem/1.2 var(--f-titel)} .kachel-text{font-size:.86rem;color:var(--tinte-2);line-height:1.35}
.still .ein{animation:none}

/* ---------- 1 Ziele: Zeitstrahl ---------- */
.zs{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:1.4rem}
.zs-bahn{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:end;animation:aufdecken 1.2s cubic-bezier(.4,.1,.3,1) backwards}
.zs-halt{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.zs-karte{display:flex;flex-direction:column;gap:.25rem;background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.75rem .85rem;margin-right:.7rem;min-width:0;max-width:100%}
.zs-karte strong{font-size:1rem;line-height:1.25} .zs-betrag{font:600 1.5rem/1.1 var(--f-titel);letter-spacing:-.01em} .zs-notiz{font-size:.8rem;color:var(--tinte-2)}
.haken{font-size:.72rem;font-weight:650;color:var(--erledigt)} .haken::before{content:"✓ "}
.zs-halt.erreicht .zs-karte{background:var(--flaeche-2)} .zs-halt.erreicht .zs-betrag{color:var(--tinte-2)}
.zs-stiel{width:2px;height:calc(1.1rem + var(--h)*2.7rem);background:var(--tf);margin-left:.55rem}
.zs-achse{position:relative;width:100%;height:1.2rem;display:flex;align-items:center}
.zs-achse::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--tf);opacity:.45}
.zs-halt:first-child .zs-achse::before{border-radius:2px 0 0 2px} .zs-halt:last-child .zs-achse::before{border-radius:0 2px 2px 0}
.zs-punkt{position:relative;width:1.2rem;height:1.2rem;border-radius:50%;background:var(--tf);border:3px solid var(--bg)}
.zs-jahr{display:flex;flex-direction:column;padding-top:.3rem;font-size:.8rem;color:var(--tinte-2);line-height:1.25} .zs-jahr b{font:650 1.15rem var(--f-titel);color:var(--tinte)}
.zs-summen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85rem}
.zs-summe{display:flex;flex-direction:column;gap:.3rem;background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.8rem 1rem}
.zs-summe p{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:.82rem;color:var(--tinte-2)} .zs-summe b{font:600 1.6rem/1.15 var(--f-titel)} .zs-summe b.text{font:500 1.05rem/1.3 var(--f-text)}

/* ---------- 2 Drittel-Regel ---------- */
.db{display:grid;grid-template-columns:14rem minmax(0,1fr);gap:1.5rem 2.5rem;align-items:center;flex:1;align-content:space-evenly}
.db-zeilen{display:flex;flex-direction:column;gap:1.2rem}
.db-zeile{display:grid;grid-template-columns:8.5rem minmax(0,1fr);align-items:center;gap:1rem} .db-name{font-weight:600;font-size:.95rem}
.db-balken{display:flex;gap:2px;height:3.2rem}
.db-teil{flex:0 1 auto;min-width:0;background:var(--f);border-radius:3px;display:flex;align-items:center;padding-left:.6rem;overflow:hidden;transition:flex-basis .95s var(--kurve)}
.db-teil b{font-size:.9rem;color:#fff;white-space:nowrap} .db-teil[data-teil="leben"] b{color:var(--auf-leben)} .db-teil.klein{padding:0}
.db-spaeter{flex:0 0 3.6rem;text-align:right;font-size:.9rem;align-self:center}
.db-balken.regel{padding-right:calc(3.6rem + 2px)}
.db-balken.regel i{flex:1 1 0;border:1.5px dashed var(--linie-2);border-radius:3px;display:flex;align-items:center;justify-content:center;gap:.6rem;font-size:.92rem;color:var(--tinte-2)} .db-balken.regel b{color:var(--tinte)}
.db-v{opacity:0;transition:opacity .5s} [data-schritt="1"] .db-v{opacity:1}
.db-karten{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85rem}
.db-karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.9rem 1.1rem;display:flex;flex-direction:column;gap:.25rem}
.db-kname{font-weight:650;display:flex;align-items:center} .db-kzahl{font:600 1.9rem/1.1 var(--f-titel);letter-spacing:-.015em} .db-kzahl small{font:400 .82rem var(--f-text);letter-spacing:0} .db-ktext{font-size:.92rem}

/* ---------- 3 Heute aufgestellt ---------- */
.ha{display:flex;flex-direction:column;gap:.9rem;flex:1}
.ha-toepfe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85rem}
.ha-topf{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:.6rem;min-height:24rem}
.ha-topf header{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.4rem}
.ha-mass-spur{position:relative;height:.5rem;border-radius:99px;background:color-mix(in srgb,var(--tf) 22%,var(--flaeche));margin:.2rem 0 .35rem}
.ha-mass-spur i{position:absolute;inset:0 auto 0 0;background:var(--tf);border-radius:99px;animation:wachs .9s var(--kurve) backwards;transform-origin:left}
.ha-mass-spur em{position:absolute;top:-.25rem;bottom:-.25rem;width:2px;background:var(--tinte)}
.ha-rente{font-size:.92rem;color:var(--tinte-2)} .ha-rente b{color:var(--tinte);font-size:1.1rem}
.ha-rate{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--linie);padding-top:.6rem;margin-top:auto;font-size:.92rem} .ha-rate b{font:600 1.35rem var(--f-titel)}
.ha-liste{display:flex;flex-direction:column;gap:.3rem;font-size:.88rem} .ha-liste li{display:flex;flex-direction:column} .ha-liste span{color:var(--tinte-2);font-size:.82rem}
.ha-risiko{display:grid;grid-template-columns:13rem minmax(0,1fr);gap:1rem 2rem;align-items:center;background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.9rem 1.15rem}
.ha-rp{font-size:.95rem;color:var(--tinte-2)} .ha-rp b{font:600 2.1rem/1 var(--f-titel);color:var(--tinte)}
.ha-skala-spur{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.ha-skala-spur i{height:2rem;display:grid;place-items:center;background:var(--flaeche-2);border-radius:3px;font-style:normal;font-size:.8rem;color:var(--tinte-3)} .ha-skala-spur i.an{color:var(--tinte);font-weight:700}
#ha-zeiger{position:absolute;top:-.3rem;width:calc(10% + .3rem);height:2.6rem;margin-left:calc(-5% - .15rem);border:3px solid var(--tinte);border-radius:.45rem;transition:left 1s var(--kurve)}
.ha-skala-text{display:flex;justify-content:space-between;font-size:.8rem;color:var(--tinte-2);margin-top:.5rem}

/* ---------- 4 Einkommen ---------- */
.fl{flex:1;display:flex;flex-direction:column;gap:.7rem;min-height:0}
.fl-bild{flex:1;min-height:21rem;overflow:hidden}
.fl-fazit{font-size:1.05rem;min-height:3.05rem;max-width:none}
.fl-t{font-size:.86rem;fill:var(--tinte-2)} .fl-w{font-weight:700;fill:var(--tinte)}
.fl-kopf{font-size:.74rem;font-weight:650;letter-spacing:.09em;text-transform:uppercase;fill:var(--tinte-3)} .fl-kopf .fl-w{font-size:.95rem;letter-spacing:0}
.fl-gross{font:600 1.55rem var(--f-titel);fill:var(--tinte);letter-spacing:-.015em}
.fl-liste{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.fl-lkopf{display:flex;justify-content:space-between;align-items:baseline;font-weight:650;margin:.9rem 0 .4rem} .fl-lkopf b{font:600 1.5rem var(--f-titel)}
.fl-liste li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem .8rem;padding:.4rem 0;border-top:1px solid var(--linie);font-size:.92rem}
.fl-liste li i{grid-column:1/-1;grid-row:2;height:.4rem;border-radius:99px;background:var(--flaeche-2)} .fl-liste li u{display:block;height:100%;border-radius:99px;transition:width .8s var(--kurve)}
.fl-liste li b{font-variant-numeric:tabular-nums} .fl-liste li.weg span{text-decoration:line-through;color:var(--tinte-3)}

/* ---------- 5 Übersicht ---------- */
.ub{display:flex;flex-direction:column;gap:.4rem;flex:1;justify-content:center}
.ub-kopf,.ub-zeile{display:grid;grid-template-columns:minmax(11rem,16rem) minmax(0,1fr) 7rem 10rem 1rem;gap:1.2rem;align-items:center;padding:.65rem 1.1rem}
.ub-kopf{padding-block:0;font-size:.72rem;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--tinte-3)} .ub-kopf span{text-align:right}
.ub-gruppe{font-size:.72rem;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--tinte-3);margin:.5rem 0 .1rem 1.1rem}
.ub-zeile{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r-s);text-align:left;width:100%;transition:border-color .2s}
button.ub-zeile:hover{border-color:var(--tinte-3)} .ub-zeile.leer{background:none;border-style:dashed}
.ub-name{display:grid;grid-template-columns:auto 1fr;align-items:baseline} .ub-name b{font:650 1.12rem var(--f-titel)} .ub-name small{grid-column:2} .ub-summe .ub-name{display:block}
.ub-spur{position:relative;height:1.15rem}
.ub-geist{position:absolute;inset:-.3rem auto -.3rem 0;border-right:2px solid var(--tinte);z-index:1;opacity:0;transition:opacity .4s .5s}
.ub-balken{position:absolute;inset:0 auto 0 0;display:flex;gap:2px;background:var(--f);border-radius:0 4px 4px 0;overflow:hidden;transition:width .95s var(--kurve);animation:wachs .9s var(--kurve) backwards;animation-delay:calc(var(--i,0)*70ms + .1s);transform-origin:left}
.ub-balken.kap{background:none} .ub-seg{flex:1 1 0;background:var(--f);transition:flex-grow .95s var(--kurve)}
.ub-wert{text-align:right;font:600 1.3rem var(--f-titel);font-variant-numeric:tabular-nums;white-space:nowrap}
.ub-v{opacity:0;transition:opacity .45s} .ub-v .delta{display:block;font:500 .8rem var(--f-text);color:var(--tinte-2);font-style:normal}
[data-schritt="1"] .ub-v,[data-schritt="1"] .ub-geist{opacity:1} [data-schritt="0"] .ub-h{color:var(--tinte)} [data-schritt="1"] .ub-wert.ub-h{color:var(--tinte-3)}
.ub-pfeil{font-size:1.4rem;color:var(--tinte-3);line-height:1}
.ub-summe{background:none;border-color:transparent;border-top:2px solid var(--tinte);border-radius:0;margin-top:.4rem} .ub-hinweis{margin-left:1.1rem}
.ub-strich{opacity:0;transition:opacity .4s} [data-schritt="1"] .ub-strich{opacity:1} .ub-strich i{display:inline-block;width:2px;height:.9rem;background:var(--tinte);vertical-align:-.15rem;margin-right:.4rem}

/* ---------- 6 Bereiche im Detail ---------- */
.bd{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.3rem;align-items:start;flex:1}
.bd-liste,.bd-seite{display:flex;flex-direction:column;gap:.7rem;min-width:0}
.bd-zeile{display:grid;grid-template-columns:minmax(0,1fr) 1.4rem minmax(0,1fr);gap:.35rem .7rem;background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.75rem 1rem;transition:border-color .25s,box-shadow .25s}
.bd-zeile header{grid-column:1/-1;display:flex;align-items:center;gap:.6rem} .bd-zeile strong{font:650 1.12rem var(--f-titel)}
.bd-zeile strong::before{content:"";display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:var(--f);margin-right:.5rem}
.person,.bd-art{font-size:.72rem;font-weight:650;padding:.1rem .5rem;border-radius:99px;background:var(--flaeche-2);color:var(--tinte-2)}
.bd-art{margin-left:auto;border:1px solid var(--linie-2);background:none}
.bd-oben{display:flex;justify-content:space-between;align-items:flex-start;gap:.2rem 1rem;flex-wrap:wrap}
.bd-wer{display:flex;flex-direction:column;font-size:.95rem} .bd-wer span{font-size:.82rem;color:var(--tinte-2)}
.bd-beitrag{font-size:.82rem;color:var(--tinte-2);text-align:right;line-height:1.3} .bd-beitrag b{font:600 1.3rem/1.1 var(--f-titel);color:var(--tinte)} .bd-beitrag small{display:block}
.bd-kond,.bd-hinweis{font-size:.84rem;color:var(--tinte-2);margin-top:.25rem} .bd-hinweis{color:var(--tinte);font-weight:550}
.bd-pfeil{align-self:center;color:var(--tinte-3);font-size:1.2rem}
.bd-diff{font-size:.84rem;font-weight:650;margin-top:.35rem} .bd-mehr{margin-left:.7rem;font-weight:550;text-decoration:underline;text-underline-offset:.2em;color:var(--tinte-2)}
.bd-neu,.bd-pfeil,.bd-art{opacity:0;transform:translateX(-.7rem);transition:opacity .45s,transform .55s var(--kurve);transition-delay:calc(var(--i,0)*90ms)}
[data-schritt="1"] .bd-neu,[data-schritt="1"] .bd-pfeil,[data-schritt="1"] .bd-art{opacity:1;transform:none}
.bd-eins{grid-column:1/-1;display:grid;grid-template-columns:minmax(9rem,auto) minmax(0,1fr) auto;gap:.1rem 1.5rem;align-items:start}
.bd-eins .bd-oben{display:contents} .bd-eins .bd-wer{grid-column:1;grid-row:1/3} .bd-eins .bd-beitrag{grid-column:3;grid-row:1/3}
.bd-eins .bd-kond,.bd-eins .bd-hinweis{grid-column:2;margin:0} .bd-zeile.bleibt{padding-block:.6rem .7rem}
.bd-zeile.waehlbar{cursor:pointer} [data-schritt="1"] .bd-zeile.gewaehlt{border-color:var(--f);box-shadow:0 0 0 1px var(--f)}
.vgl{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.9rem 1rem;display:flex;flex-direction:column;gap:.6rem;animation:ein .5s var(--kurve) backwards;animation-delay:.25s}
.vgl-rahmen{overflow-x:auto}
.vgl-tab{display:grid;grid-template-columns:minmax(7rem,2.3fr) repeat(var(--n),minmax(5.4rem,1fr));min-width:23rem;font-size:.84rem}
.vgl-tab>div{padding:.36rem .5rem;border-bottom:1px solid var(--linie);display:flex;flex-direction:column;justify-content:center}
.vgl-k{color:var(--tinte-2)} .vgl-z{align-items:center;text-align:center} .vgl-z.gew{background:color-mix(in srgb,var(--f) 13%,var(--flaeche))}
.vgl-kopf{line-height:1.25} .vgl-kopf small{font-size:.68rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--tinte-3)} .vgl-kopf span{font-size:.78rem;color:var(--tinte-2)}
.vgl-kopf.gew{border-radius:.5rem .5rem 0 0} .vgl-kopf.gew small{color:var(--tinte)} .vgl-preis b{font:600 1.05rem var(--f-titel)}
.st{display:inline-flex;vertical-align:-.2em} .st svg{width:1.15rem;height:1.15rem} .st-0{color:var(--tinte-3)}
.vgl-leg{font-size:.74rem;color:var(--tinte-2);display:flex;align-items:center;gap:.3rem;flex-wrap:wrap} .vgl-leg .st{margin-left:.6rem} .vgl-leg .st:first-child{margin-left:0} .vgl-leg .st svg{width:.9rem;height:.9rem}
.vgl-warum{display:flex;flex-direction:column;gap:.35rem;font-size:.92rem} .vgl-warum li{padding-left:1.1rem;position:relative}
.vgl-warum li::before{content:"";position:absolute;left:0;top:.5em;width:.45rem;height:.45rem;border-radius:50%;background:var(--f)}

/* ---------- 7 Drei Töpfe, Vermögensaufbau, Kurz oder mittel ---------- */
.tp{display:flex;flex-direction:column;gap:.9rem;flex:1}
.tp-toepfe,.va-felder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85rem;flex:1}
.tp-topf{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:1rem 1.15rem;display:flex;flex-direction:column;gap:.7rem}
.tp-topf h2{font:600 1.7rem/1.1 var(--f-titel);letter-spacing:-.015em;margin:.15rem 0 .25rem}
.tp-mitte{display:grid;grid-template-columns:5rem minmax(0,1fr);gap:1.2rem;align-items:end}
.tp-gefaess{position:relative;height:7.2rem;border:2px solid var(--linie-2);border-top:0;border-radius:0 0 1.1rem 1.1rem;overflow:hidden;background:var(--flaeche-2)}
.tp-fuellung{position:absolute;inset:auto 0 0 0;background:var(--tf);transition:height 1s var(--kurve)}
.tp-linie{position:absolute;left:0;right:0;border-top:2px dashed var(--tinte);opacity:0;transition:opacity .4s}
.tp-delta{font-size:.88rem;color:var(--tinte-2);opacity:0;transition:opacity .4s} [data-schritt="1"] .tp-delta{opacity:1} [data-schritt="1"] .tp-linie{opacity:.75}
.tp-ziele,.tp-wege{display:flex;flex-direction:column;font-size:.9rem;border-top:1px solid var(--linie)}
.tp-ziele li,.tp-wege li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 .8rem;padding:.4rem 0;border-bottom:1px solid var(--linie)}
.tp-ziele li:last-child,.tp-wege li:last-child{border-bottom:0} .tp-ziele small,.tp-wege span{grid-column:1;grid-row:2;font-size:.78rem;color:var(--tinte-2)}
.tp-wege em{font-style:normal;font-weight:650;font-variant-numeric:tabular-nums} .tp-wege small{grid-column:2;grid-row:2;text-align:right}
.tp-wege{border-top:0;background:var(--flaeche-2);border-radius:var(--r-s);padding:.2rem .75rem;margin-top:auto}
[data-schritt="0"] .tp-v,[data-schritt="1"] .tp-h{display:none}
.tp-summe{display:flex;align-items:baseline;gap:.5rem 1rem;flex-wrap:wrap;font-size:1rem;color:var(--tinte-2)} .tp-summe>b{font:600 1.9rem var(--f-titel);color:var(--tinte)} .tp-summe span b{color:var(--tinte)}
.va{display:flex;flex-direction:column;gap:.8rem;flex:1}
.va-feld{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.85rem 1rem;display:flex;flex-direction:column;gap:.45rem;min-width:0}
.va-feld h2{font:600 1.15rem var(--f-titel);display:flex;align-items:baseline;gap:.7rem;margin-top:.15rem}
.va-chart{height:10.5rem;overflow:hidden;flex:none}
.va-ziele{display:flex;flex-direction:column;font-size:.86rem;counter-reset:z}
.va-ziele li{counter-increment:z;display:grid;grid-template-columns:1.3rem minmax(0,1fr) auto;gap:0 .5rem;padding:.3rem 0;border-top:1px solid var(--linie)}
.va-ziele li::before{content:counter(z);font-weight:700;font-size:.75rem;width:1.15rem;height:1.15rem;display:grid;place-items:center;border-radius:50%;background:var(--tf);color:#fff;grid-row:1/3;align-self:center}
.va-ziele li.offen::before{background:none;border:2px solid var(--tf);color:var(--tinte)} .va-ziele small{grid-column:2/-1} .va-ziele li.offen small{color:var(--tinte);font-weight:600}
.va-ende{font-size:.92rem;margin-top:auto;padding-top:.3rem} .va-ende b{font:600 1.25rem var(--f-titel)} .va-ende small{display:block}
.va-unten{display:flex;gap:.8rem 2rem;align-items:center;flex-wrap:wrap;background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:.6rem 1rem}
.reglerreihe{flex:1 1 30rem;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem 1.6rem} .va-neben{display:flex;flex-direction:column;gap:.3rem}
.km,.rl{display:grid;grid-template-columns:minmax(0,1fr) 22rem;gap:1.5rem;flex:1;min-height:0;align-items:start}
.km-haupt,.rl-haupt{display:flex;flex-direction:column;gap:.75rem;min-width:0;align-self:stretch}
.km-kacheln,.rl-zahlen,.vl-zahlen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85rem}
.km-chart{flex:1;min-height:15rem;overflow:hidden}

/* ---------- 8 Rentenlücke ---------- */
.kz-luecke{border-color:var(--tinte)}
.rl-bild{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:2.5rem 1rem .9rem}
.rl-spur{position:relative;display:flex;gap:2px;height:3.2rem}
.rl-teil{flex:0 0 auto;width:0;min-width:0;border-radius:3px;transition:width .95s var(--kurve)} .sofort .rl-teil,.sofort .rl-band,.sofort .rl-ziel{transition:none}
.rl-g{background:var(--tinte)} .rl-b{background:var(--leben)} .rl-v{background:var(--lang)}
.rl-l,.rl-leg i.schraff{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--tinte-3) 60%,transparent) 5px 7px);outline:1.5px dashed var(--tinte-3);outline-offset:-1.5px}
.rl-band{position:absolute;top:50%;height:1rem;margin-top:-.5rem;border-inline:2px solid var(--tinte);background:linear-gradient(var(--tinte),var(--tinte)) center/100% 2px no-repeat;opacity:0;transition:opacity .4s .6s,left .95s var(--kurve),width .95s var(--kurve);filter:drop-shadow(0 0 1px var(--flaeche))}
.rl-ziel{position:absolute;top:-1.7rem;bottom:-.45rem;width:0;border-left:2px solid var(--tinte);transition:left .95s var(--kurve);z-index:1}
.rl-ziel span{position:absolute;top:-.1rem;right:.45rem;font-size:.8rem;font-weight:650;white-space:nowrap}
.rl-leg{display:flex;flex-wrap:wrap;gap:.3rem 1.5rem;font-size:.88rem;margin-top:.75rem;min-height:1.4rem} .rl-leg li{display:flex;align-items:baseline;gap:.4rem;flex-wrap:wrap}
.rl-leg i.feld{width:.8rem;height:.8rem;border-radius:2px;align-self:center}
.rl-stufen{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.4rem}
.rl-stufen span{flex:1 1 9rem;display:flex;flex-direction:column;justify-content:space-between;gap:.2rem;background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r-s);padding:.5rem .75rem}
.rl-stufen b{font:600 1.25rem var(--f-titel);font-variant-numeric:tabular-nums} .rl-stufen .summe{background:var(--tinte);border-color:var(--tinte);color:var(--umkehr)} .rl-stufen .summe small{color:inherit;opacity:.75}

/* ---------- 9 Nächste Schritte, 10 Verlauf, Zum Schluss ---------- */
.ns{display:flex;flex-direction:column;gap:.9rem;flex:1}
.ns-spalte{min-height:19rem}
.ns-termin{background:var(--tinte);color:var(--umkehr);border-radius:var(--r);padding:1.1rem 1.4rem;display:grid;grid-template-columns:auto 1fr;gap:.1rem 2rem;align-items:baseline}
.ns-termin .etikett{color:inherit;opacity:.7;grid-column:1/-1} .ns-art{font:600 2rem/1.1 var(--f-titel);letter-spacing:-.02em} .ns-wann{font-size:1.2rem}
.ns-spalten{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.85rem}
.ns-spalte,.vl-seite section{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:1rem 1.15rem}
.ns-spalte h2,.vl-seite h2{font:650 1.15rem var(--f-titel);margin-bottom:.7rem}
.ns-liste{display:flex;flex-direction:column;gap:.75rem} .ns-liste li{display:flex;gap:.7rem;align-items:flex-start} .ns-liste span{display:flex;flex-direction:column;font-size:1rem;line-height:1.3}
.kasten{flex:none;width:1.25rem;height:1.25rem;border:2px solid var(--tinte-3);border-radius:.3rem;margin-top:.05rem;display:grid;place-items:center}
.erledigt .kasten{background:var(--erledigt);border-color:var(--erledigt)} .erledigt .kasten::after{content:"";width:.6rem;height:.32rem;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(.05rem,-.05rem)}
.erledigt>span{color:var(--tinte-3)}
.blatt{flex:none;width:1rem;height:1.25rem;border:2px solid var(--tinte-3);border-radius:2px .45rem 2px 2px;margin-top:.05rem}
.vl{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.4rem;flex:1;align-items:start}
.vl-depot{display:flex;flex-direction:column;gap:.75rem;min-width:0;align-self:stretch} .vl-seite{display:flex;flex-direction:column;gap:.75rem;min-width:0}
.vl-chart{flex:1;min-height:14rem;overflow:hidden}
.vl-pos li{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 6rem 3rem;gap:1rem;align-items:center;padding:.4rem 0;border-top:1px solid var(--linie);font-size:.92rem}
.vl-pos i{height:.5rem;border-radius:99px;background:color-mix(in srgb,var(--mittel) 20%,var(--flaeche))} .vl-pos u{display:block;height:100%;border-radius:99px;background:var(--mittel);animation:wachs .9s var(--kurve) backwards;transform-origin:left}
.vl-pos b,.vl-pos small{text-align:right;font-variant-numeric:tabular-nums}
.vl-liste li{display:flex;gap:.6rem;align-items:flex-start} .vl-liste span,.vl-neu li{display:flex;flex-direction:column}
.haken-kreis{flex:none;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--f);margin-top:.12rem;display:grid;place-items:center}
.haken-kreis::after{content:"";width:.5rem;height:.26rem;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(.04rem,-.04rem)}
.vl-termine{border-left:2px solid var(--linie-2);margin-left:.4rem;display:flex;flex-direction:column;gap:.6rem}
.vl-termine li{position:relative;padding-left:1.1rem;display:grid;grid-template-columns:auto 1fr;gap:0 .6rem;align-items:baseline}
.vl-termine li::before{content:"";position:absolute;left:calc(-.4rem - 1px);top:.35rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--tinte-3);border:2px solid var(--flaeche)}
.vl-termine li.jetzt::before{background:var(--tinte);box-shadow:0 0 0 2px var(--tinte)} .vl-termine li.offen::before{background:var(--flaeche);border-color:var(--tinte-3)}

/* =====================================================================================
   3. RECHENKERN  –  reine Funktionen ohne Bildschirm. Regeln: agent/fachwissen.md 6.1 bis 6.4.
   Alles wird zuerst nominal gerechnet (Euro zum jeweiligen Zeitpunkt) und für die Anzeige
   "heutige Kaufkraft" mit der Inflation zurückgerechnet. Nie gemischt.
   ===================================================================================== */
const RECHNEN = (() => {
  const F = DATEN.finanzstatus, A = DATEN.annahmen, M = DATEN.mandant;
  const standJahr = +DATEN.meta.Stand.slice(0, 4), standMonat = +DATEN.meta.Stand.slice(5, 7) - 1;
  const summe = (liste, f) => liste.reduce((s, x) => s + (f(x) || 0), 0);
  const proMonat = v => { const teiler = { monatlich: 1, vierteljaehrlich: 3, halbjaehrlich: 6, jaehrlich: 12 }[v.Zahlweise || "monatlich"]; return teiler ? (v.Beitrag || 0) / teiler : 0; };
  const monatszins = pa => Math.pow(1 + pa, 1 / 12) - 1;
  const TOEPFE = ["kurz", "mittel", "lang"], BEREICHE = ["Gesundheit", "Basisrisiken", "Einkommen", "Wohnen", "Kapital"];

  /* Netto im Monat: aus Brutto minus Steuer und Abgaben, sonst Mitte der Spanne */
  const netto = () => F.Brutto != null && F.Steuer != null
    ? F.Brutto - F.Steuer - (F.AbgabenAV || 0) - (F.AbgabenKVPV || 0) - (F.AbgabenRV || 0)
    : ((F.NettoVon || 0) + (F.NettoBis || F.NettoVon || 0)) / 2;
  const sparraten = wann => { const q = wann === "vorschlag" && DATEN.vorschlag ? DATEN.vorschlag : F; return { kurz: q.SparrateKurz || 0, mittel: q.SparrateMittel || 0, lang: q.SparrateLang || 0 }; };
  const sparSumme = wann => { const s = sparraten(wann); return s.kurz + s.mittel + s.lang; };

  /* Zeilen eines Bereichs: bestehender Vertrag und, falls vorhanden, der Vorschlag, der ihn ersetzt */
  function zeilen(bereich) {
    const alle = DATEN.vertraege.filter(v => v.Bereich === bereich);
    const neu = alle.filter(v => v.Status === "Vorschlag");
    const zeilen = alle.filter(v => v.Status === "aktiv").map(heute => {
      const vorschlag = neu.find(n => n.ErsetztVertragId === heute.VertragId) || null;
      return { heute, vorschlag, art: vorschlag ? "wechsel" : "bleibt" };
    });
    neu.filter(n => !n.ErsetztVertragId).forEach(vorschlag => zeilen.push({ heute: null, vorschlag, art: "neu" }));
    return zeilen;
  }
  /* Aufwand je Bereich im Monat, heute und mit Vorschlag. Kapital = Sparraten. */
  function bereichSummen() {
    return BEREICHE.map(name => {
      if (name === "Kapital") return { name, heute: sparSumme("heute"), vorschlag: sparSumme("vorschlag"), toepfe: { heute: sparraten("heute"), vorschlag: sparraten("vorschlag") }, anzahl: zeilen(name).length };
      const z = zeilen(name);
      return { name, anzahl: z.length, heute: summe(z, x => x.heute && proMonat(x.heute)), vorschlag: summe(z, x => proMonat(x.vorschlag || x.heute)) };
    });
  }

  /* Wohin das Netto heute geht, und was davon im Alter bleibt */
  function verwendung() {
    const aktiv = DATEN.vertraege.filter(v => v.Status === "aktiv" && !v.UeberGehalt);
    const b = DATEN.bedarfImAlter || {};
    const teile = [
      { id: "bu",      name: "Absicherung Arbeitskraft",  heute: summe(aktiv.filter(v => v.Bereich === "Einkommen"), proMonat), alter: 0 },
      { id: "sparen",  name: "Vermögensaufbau",           heute: sparSumme("heute"), alter: 0 },
      { id: "leben",   name: "Lebenshaltung, Freizeit",   heute: F.Lebenshaltung || 0, alter: b.Lebenshaltung ?? 0 },
      { id: "kredit",  name: "Verbindlichkeiten",         heute: F.Verbindlichkeiten || 0, alter: 0 },
      { id: "wohnen",  name: "Wohnkosten",                heute: F.Wohnkosten || 0, alter: b.Wohnkosten ?? 0 },
      { id: "risiken", name: "Absicherung von Risiken",   heute: summe(aktiv.filter(v => ["Gesundheit", "Basisrisiken", "Wohnen"].includes(v.Bereich)), proMonat), alter: b.Absicherung ?? 0 }
    ];
    const rest = netto() - summe(teile, t => t.heute);
    if (Math.abs(rest) >= 1) teile.push({ id: "rest", name: rest > 0 ? "Nicht zugeordnet" : "Mehr verplant als Netto", heute: Math.abs(rest), alter: 0 });
    return teile;
  }
  const bedarf = () => DATEN.bedarfImAlter ? summe(Object.values(DATEN.bedarfImAlter), x => x) : (F.BedarfImAlter || 0);

  /* Sparplan: Rate am Monatsanfang, Zins monatlich. pa = Rendite nach Kosten pro Jahr. */
  function sparplan({ start = 0, rate = 0, monate, pa, dynamik = 0 }) {
    const rm = monatszins(pa); let kapital = start, eingezahlt = start, r = rate;
    for (let m = 1; m <= monate; m++) {
      if (m > 1 && (m - 1) % 12 === 0) r *= 1 + dynamik;
      kapital = (kapital + r) * (1 + rm); eingezahlt += r;
    }
    return { kapital, eingezahlt };
  }

  /* Gesetzliche Rente im ersten Rentenjahr, in heutiger Kaufkraft (Annahme: Rentenanpassungen = Inflation) */
  function gesetzlicheRente(alter, steuersatz) {
    const regel = RECHT.Regelaltersgrenze, jahr = M.Geburtsjahr + alter;
    const infoJahr = +(F.RenteninfoStand || DATEN.meta.Stand).slice(0, 4);
    let brutto = F.RenteLautInfo || 0;
    if (alter < regel && F.RenteBisherErreicht != null) {           // weniger Beitragsjahre: linear zwischen "bisher erreicht" und Hochrechnung
      const bisRegel = M.Geburtsjahr + regel - infoJahr;
      brutto = F.RenteBisherErreicht + (F.RenteLautInfo - F.RenteBisherErreicht) * Math.max(0, bisRegel - (regel - alter)) / bisRegel;
    }
    const abschlagSatz = Math.max(0, regel - alter) * 12 * RECHT.AbschlagProMonat;
    const vorAbschlag = brutto; brutto *= 1 - abschlagSatz;
    const kvpvSatz = A.Kinderlos ? RECHT.KvPvRentner.kinderlos : RECHT.KvPvRentner.mitKind;
    const anteil = RECHT.besteuerungsanteil(jahr);
    const kvpv = brutto * kvpvSatz, steuer = brutto * anteil * steuersatz;
    return { jahr, laut: F.RenteLautInfo || 0, vorAbschlag, abschlagSatz, brutto, kvpvSatz, kvpv, besteuerungsanteil: anteil, steuer, netto: brutto - kvpv - steuer };
  }

  /* Monatsrente aus einem Vertrag im langen Topf, netto, nominal im ersten Rentenjahr */
  function renteAusVertrag(v, rate, jahre, rendite, alter, steuersatz, infl) {
    const kosten = (v.EffektivkostenProzent ?? A.KostenLangProzent) / 100;
    const { kapital, eingezahlt } = sparplan({ start: v.Wert || 0, rate, monate: jahre * 12, pa: rendite - kosten, dynamik: A.DynamikProzent / 100 });
    const brutto = kapital / 10000 * (v.Rentenfaktor ?? A.Rentenfaktor);
    let nettoRente;
    if (v.RentenArt === "gefoerdert") nettoRente = brutto * (1 - steuersatz);                                     // Riester, Altersvorsorgedepot: voll steuerpflichtig
    else if (v.RentenArt === "bav") {                                                                             // bAV: voll steuerpflichtig, dazu volle Kranken-/Pflegebeiträge
      const frei = RECHT.Bav.FreibetragKv * infl;                                                                // Freibetrag wächst mit (Annahme: wie die Inflation)
      const kv = Math.max(0, brutto - frei) * RECHT.Bav.KvSatz;
      const pv = brutto > frei ? brutto * (A.Kinderlos ? RECHT.Bav.PvSatz.kinderlos : RECHT.Bav.PvSatz.mitKind) : 0;
      nettoRente = brutto * (1 - steuersatz) - kv - pv;
    } else nettoRente = brutto * (1 - RECHT.ertragsanteil(alter) * steuersatz);                                    // private Rente: nur der Ertragsanteil
    return { kapital, eingezahlt, brutto, netto: nettoRente };
  }

  /* Rentenlücke. p: { alter, sparrateLang, rendite, inflation, steuersatz, kaufkraft } (Prozentwerte als Zahl, z. B. 5) */
  function rentenluecke(p) {
    const alter = p.alter, jahre = Math.max(0, M.Geburtsjahr + alter - standJahr);
    const infl = Math.pow(1 + p.inflation / 100, jahre), s = p.steuersatz / 100;
    const band = A.RenditeBandbreite, renditen = { tief: p.rendite - band, erwartet: p.rendite, hoch: p.rendite + band };
    const g = gesetzlicheRente(alter, s);
    const lang = DATEN.vertraege.filter(v => v.Bereich === "Kapital" && v.Topf === "lang");
    let neu = lang.filter(v => v.Status === "Vorschlag");
    const ersetzt = new Set(neu.map(v => v.ErsetztVertragId).filter(Boolean));
    const aktiv = lang.filter(v => v.Status === "aktiv");
    if (!neu.length) neu = [{ Beitrag: 1, Zahlweise: "monatlich", virtuell: true }];
    const neuSumme = summe(neu, proMonat) || 1;
    const fall = r => {
      const heute = summe(aktiv, v => renteAusVertrag(v, proMonat(v), jahre, r / 100, alter, s, infl).netto);
      const bleibt = summe(aktiv.filter(v => !ersetzt.has(v.VertragId)), v => renteAusVertrag(v, proMonat(v), jahre, r / 100, alter, s, infl).netto);
      const teile = neu.map(v => renteAusVertrag(v, p.sparrateLang * proMonat(v) / neuSumme, jahre, r / 100, alter, s, infl));
      return { heute: heute / infl, bleibt: bleibt / infl, neu: summe(teile, t => t.netto) / infl, neuBrutto: summe(teile, t => t.brutto) / infl, kapital: summe(teile, t => t.kapital) / infl, eingezahlt: summe(teile, t => t.eingezahlt) };
    };
    const f = { tief: fall(renditen.tief), erwartet: fall(renditen.erwartet), hoch: fall(renditen.hoch) };
    const b = bedarf(), k = p.kaufkraft === "nominal" ? infl : 1;      // k rechnet heutige Kaufkraft in Euro des Rentenjahres um
    const mal = (o, keys) => Object.fromEntries(Object.entries(o).map(([key, v]) => [key, keys.includes(key) ? v * k : v]));
    const drei = fn => ({ tief: fn(f.tief) * k, erwartet: fn(f.erwartet) * k, hoch: fn(f.hoch) * k });
    return {
      alter, jahr: g.jahr, jahre, inflationsfaktor: infl, renditen, ertragsanteil: RECHT.ertragsanteil(alter),
      bedarf: b * k,
      gesetzlich: mal(g, ["laut", "vorAbschlag", "brutto", "kvpv", "steuer", "netto"]),
      bestehendHeute: drei(x => x.heute),                              // private Vorsorge, die heute schon läuft
      bestehendBleibt: drei(x => x.bleibt),
      vorschlag: drei(x => x.neu), vorschlagBrutto: drei(x => x.neuBrutto), kapital: drei(x => x.kapital), eingezahlt: f.erwartet.eingezahlt,
      lueckeHeute: (b - g.netto - f.erwartet.heute) * k,
      lueckeVorschlag: { tief: (b - g.netto - f.hoch.bleibt - f.hoch.neu) * k, erwartet: (b - g.netto - f.erwartet.bleibt - f.erwartet.neu) * k, hoch: (b - g.netto - f.tief.bleibt - f.tief.neu) * k }
    };
  }

  /* Kurz oder mittel bei gleicher Sparrate. Liefert je Jahr den Wert nach Kosten und Steuern
     (so, als würde man in dem Jahr alles auflösen). p: { rate, jahre, zins, rendite, inflation, kaufkraft } */
  function kurzOderMittel(p) {
    const abg = RECHT.Abgeltungsteuer, tf = RECHT.TeilfreistellungAktienfonds, frei = A.SparerpauschbetragJahr || 0;
    const real = p.kaufkraft !== "nominal", i = p.inflation / 100;
    const lauf = (zins, rendite) => {
      const zm = monatszins(zins / 100), rm = monatszins(rendite / 100 - A.KostenMittelProzent / 100);
      let kurz = 0, mittel = 0, ein = 0, einReal = 0, zinsenJahr = 0; const reihe = [{ jahr: 0, eingezahlt: 0, kurz: 0, mittel: 0 }];
      for (let m = 1; m <= p.jahre * 12; m++) {
        const z = (kurz + p.rate) * zm; kurz += p.rate + z; zinsenJahr += z;
        mittel = (mittel + p.rate) * (1 + rm); ein += p.rate; einReal += p.rate / Math.pow(1 + i, (m - 1) / 12);
        if (m % 12 === 0) {
          kurz -= Math.max(0, zinsenJahr - frei) * abg; zinsenJahr = 0;                              // Zinsen: jedes Jahr versteuert
          const steuerMittel = Math.max(0, (mittel - ein) * (1 - tf) - frei) * abg;                 // Fonds: einmal beim Verkauf, 30 % steuerfrei
          const d = real ? Math.pow(1 + i, m / 12) : 1;
          reihe.push({ jahr: m / 12, eingezahlt: real ? einReal : ein, kurz: kurz / d, mittel: (mittel - steuerMittel) / d, steuerMittel: steuerMittel / d });
        }
      }
      return reihe;
    };
    const zb = A.ZinsKurzBandbreite, rb = A.RenditeBandbreite;
    return { tief: lauf(Math.max(0, p.zins - zb), p.rendite - rb), erwartet: lauf(p.zins, p.rendite), hoch: lauf(p.zins + zb, p.rendite + rb),
             zinsen: [Math.max(0, p.zins - zb), p.zins + zb], renditen: [p.rendite - rb, p.rendite + rb] };
  }

  /* Vermögensaufbau je Topf: Monat für Monat, Ziele werden im Zieljahr (Mitte des Jahres) entnommen.
     Ziel-Beträge gelten in heutiger Kaufkraft und wachsen mit der Inflation mit. */
  function topfVerlauf(topf, p) {
    const i = p.inflation / 100, real = p.kaufkraft !== "nominal";
    const jahreBisRente = Math.max(1, M.Geburtsjahr + p.alter - standJahr);
    const ziele = DATEN.ziele.filter(z => z.Topf === topf && z.Status === "offen" && z.Betrag)
      .map(z => ({ ziel: z, monat: Math.max(1, (z.Jahr - standJahr) * 12 + 6 - standMonat) }));
    const letztes = Math.max(0, ...ziele.map(z => z.monat));
    const monate = topf === "kurz" ? Math.max(36, letztes + 6) : topf === "mittel" ? Math.min(jahreBisRente * 12, Math.max(120, letztes + 24)) : jahreBisRente * 12;
    const start = topf === "kurz" ? (F.Ruecklage || 0) : summe(DATEN.vertraege.filter(v => v.Bereich === "Kapital" && v.Topf === topf && v.Status === "aktiv"), v => v.Wert);
    const kosten = topf === "mittel" ? A.KostenMittelProzent : topf === "lang" ? A.KostenLangProzent : 0;
    const lauf = pa => {
      const rm = monatszins(pa / 100 - kosten / 100); let wert = start, rate = p.rate; const punkte = [{ m: 0, wert: start }], ereignisse = [];
      for (let m = 1; m <= monate; m++) {
        if (m > 1 && (m - 1) % 12 === 0) rate *= 1 + A.DynamikProzent / 100;
        wert = (wert + rate) * (1 + rm);
        const d = Math.pow(1 + i, m / 12), teiler = real ? d : 1;
        ziele.filter(z => z.monat === m).forEach(z => {
          const soll = z.ziel.Betrag * d, entnahme = Math.min(wert, soll);
          punkte.push({ m, wert: wert / teiler }); wert -= entnahme;
          ereignisse.push({ m, ziel: z.ziel, betrag: soll / teiler, fehlt: (soll - entnahme) / teiler, davor: (wert + entnahme) / teiler });
        });
        punkte.push({ m, wert: wert / teiler });
      }
      return { punkte, ereignisse, ende: punkte[punkte.length - 1].wert };
    };
    const basis = topf === "kurz" ? p.zins : p.rendite, band = topf === "kurz" ? A.ZinsKurzBandbreite : A.RenditeBandbreite;
    return { topf, monate, start, startJahr: standJahr, startMonat: standMonat, erwartet: lauf(basis), tief: lauf(Math.max(0, basis - band)), hoch: lauf(basis + band) };
  }

  return { TOEPFE, BEREICHE, standJahr, standMonat, proMonat, summe, netto, sparraten, sparSumme, zeilen, bereichSummen, verwendung, bedarf, sparplan, gesetzlicheRente, rentenluecke, kurzOderMittel, topfVerlauf };
})();

/* ---------- Animation: klarer Start, klares Ende, nichts läuft dauerhaft ---------- */
const ANIM = { an: true };
const weich = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
function tween(dauer, schritt, fertig) {
  if (!ANIM.an || dauer <= 0) { schritt(1); fertig && fertig(); return { stop() {} }; }
  let id, t0 = null, aus = false;
  const tick = t => {
    if (aus) return; if (t0 === null) t0 = t;
    const p = Math.min(1, (t - t0) / dauer); schritt(weich(p));
    if (p < 1) id = requestAnimationFrame(tick); else fertig && fertig();
  };
  id = requestAnimationFrame(tick);
  return { stop() { aus = true; cancelAnimationFrame(id); } };
}
/* Zahl im Element von ihrem jetzigen Wert auf den Zielwert zählen */
function zaehle(el, ziel, dauer = 850) {

  el._lauf && el._lauf.stop(); el.dataset.zahl = ziel;
  el._lauf = tween(dauer, p => { el._wert = von + (ziel - von) * p; el.textContent = f(el._wert); }, () => { el._wert = ziel; el.textContent = f(ziel); });
}
function zaehleAlle(wurzel) {

/* ---------- Achsen ---------- */
function achse(max, anzahl = 4) {
  const roh = max / anzahl, hoch = Math.pow(10, Math.floor(Math.log10(roh || 1))), n = roh / hoch;
  const schritt = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * hoch;
  const oben = Math.ceil(max / schritt) * schritt, marken = [];
  for (let v = 0; v <= oben + schritt / 2; v += schritt) marken.push(v);
  return { oben, marken };
}

/* ---------- Liniendiagramm (SVG, in echten Pixeln, damit Schrift auch am Handy lesbar bleibt) ----------
   c: { reihen:[{name, farbe, punkte:[{x,y}], gestrichelt, flaeche, ende}], baender:[{farbe, punkte:[{x,tief,hoch}]}],
        marker:[{x,y,text,farbe,offen}], xMarken:[{x,text}], xText(x), yText(y), randRechts, ruhig, hoverTitel(x) } */
function linienChart(el, c) {
  el.innerHTML = "";                                                       // erst leeren, dann messen: so passt sich das Diagramm dem freien Platz an
  const B = el.clientWidth, H = el.clientHeight, r = rem();
  if (B < 40 || H < 40) return;
  const schmal = B < 520, mitEnde = c.reihen.some(x => x.ende) && !schmal;
  const rand = { l: 3.7 * r, r: (mitEnde ? (c.randRechts || 8.5) : 0.9) * r, o: 1.1 * r, u: 1.7 * r };
  const xs = c.reihen.flatMap(x => x.punkte.map(p => p.x));
  const xMin = c.xMin ?? Math.min(...xs), xMax = c.xMax ?? Math.max(...xs);
  const ys = c.reihen.flatMap(x => x.punkte.map(p => p.y)).concat((c.baender || []).flatMap(b => b.punkte.map(p => p.hoch)), (c.marker || []).map(m => m.y));
  const { oben, marken } = achse(Math.max(1, ...ys) * 1.03, H < 14 * r ? 3 : 4);
  const sx = x => rand.l + (x - xMin) / ((xMax - xMin) || 1) * (B - rand.l - rand.r);
  const sy = y => rand.o + (1 - y / oben) * (H - rand.o - rand.u);
  const pfad = pkt => pkt.map((p, i) => (i ? "L" : "M") + sx(p.x).toFixed(1) + " " + sy(p.y).toFixed(1)).join(" ");
  const kl = c.ruhig ? "" : " zieh", bl = c.ruhig ? "" : " blend";
  let s = `<svg class="chart" width="${B}" height="${H}" viewBox="0 0 ${B} ${H}" role="img" aria-label="${esc(c.titel || "Diagramm")}">`;
  marken.forEach(v => { s += `<line class="gitter" x1="${rand.l}" x2="${B - rand.r}" y1="${sy(v)}" y2="${sy(v)}"/><text class="achse" x="${rand.l - 0.5 * r}" y="${sy(v)}" dy=".32em" text-anchor="end">${c.yText ? c.yText(v) : zahlDE(v)}</text>`; });
  (c.xMarken || []).forEach(m => { s += `<text class="achse" x="${sx(m.x)}" y="${H - 0.4 * r}" text-anchor="${m.anker || "middle"}">${esc(m.text)}</text>`; });
  s += `<line class="grundlinie" x1="${rand.l}" x2="${B - rand.r}" y1="${sy(0)}" y2="${sy(0)}"/>`;
  (c.baender || []).forEach(b => {
    const oben_ = b.punkte.map((p, i) => (i ? "L" : "M") + sx(p.x).toFixed(1) + " " + sy(p.hoch).toFixed(1)).join(" ");
    const unten = [...b.punkte].reverse().map(p => "L" + sx(p.x).toFixed(1) + " " + sy(p.tief).toFixed(1)).join(" ");
    s += `<path class="band${bl}" d="${oben_} ${unten} Z" fill="${b.farbe}"/>`;
  });
  c.reihen.forEach((x, i) => {
    if (x.flaeche) s += `<path class="flaeche${bl}" d="${pfad(x.punkte)} L${sx(x.punkte[x.punkte.length - 1].x)} ${sy(0)} L${sx(x.punkte[0].x)} ${sy(0)} Z" fill="${x.farbe}"/>`;
    s += x.gestrichelt
      ? `<path class="linie strich${bl}" d="${pfad(x.punkte)}" stroke="${x.farbe}"/>`
      : `<path class="linie${kl}" pathLength="1" d="${pfad(x.punkte)}" stroke="${x.farbe}" style="animation-delay:${i * 180}ms"/>`;
  });
  (c.marker || []).forEach(m => {
    const mx = sx(m.x), my = sy(m.y), links = mx > B - rand.r - 7 * r;
    s += `<g class="marke${bl}"><circle cx="${mx}" cy="${my}" r="${0.32 * r}" fill="${m.offen ? "var(--flaeche)" : m.farbe}" stroke="${m.offen ? m.farbe : "var(--flaeche)"}" stroke-width="2"/>`;
    if (m.text) s += `<text class="marke-text" x="${mx + (links ? -0.6 : 0.6) * r}" y="${my - 0.55 * r}" text-anchor="${links ? "end" : "start"}">${esc(m.text)}</text>`;
    s += `</g>`;
  });
  if (mitEnde) {                                                           // Beschriftung am Linienende, mit Mindestabstand
    const enden = c.reihen.filter(x => x.ende).map(x => ({ x, y: sy(x.punkte[x.punkte.length - 1].y), y0: sy(x.punkte[x.punkte.length - 1].y) })).sort((a, b) => a.y - b.y);
    const abstand = 2.5 * r;
    for (let i = 1; i < enden.length; i++) if (enden[i].y - enden[i - 1].y < abstand) enden[i].y = enden[i - 1].y + abstand;
    const ueber = enden.length ? enden[enden.length - 1].y - (H - rand.u - 0.6 * r) : 0;
    if (ueber > 0) enden.forEach(e => e.y -= ueber);
    for (let i = enden.length - 2; i >= 0; i--) if (enden[i + 1].y - enden[i].y < abstand) enden[i].y = enden[i + 1].y - abstand;
    enden.forEach(e => {
      const ex = B - rand.r;
      s += `<g class="ende${bl}"><circle cx="${ex}" cy="${e.y0}" r="${0.3 * r}" fill="${e.x.farbe}" stroke="var(--flaeche)" stroke-width="2"/>`
        + (Math.abs(e.y - e.y0) > 2 ? `<line class="fuehrung" x1="${ex + 0.3 * r}" y1="${e.y0}" x2="${ex + 0.7 * r}" y2="${e.y}"/>` : "")
        + `<text class="ende-wert" x="${ex + 0.9 * r}" y="${e.y}" dy="-.15em">${esc(e.x.ende)}</text><text class="ende-name" x="${ex + 0.9 * r}" y="${e.y}" dy="1.05em">${esc(e.x.name)}</text></g>`;
    });
  }
  s += `<line class="faden" y1="${rand.o}" y2="${H - rand.u}" x1="-9" x2="-9"/><rect class="fang" x="${rand.l}" y="${rand.o}" width="${Math.max(0, B - rand.l - rand.r)}" height="${Math.max(0, H - rand.o - rand.u)}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const fang = $(".fang", el), faden = $(".faden", el);
  const naechster = (pkt, x) => pkt.reduce((b, p) => Math.abs(p.x - x) <= Math.abs(b.x - x) ? p : b, pkt[0]);
  fang.addEventListener("pointermove", ev => {
    const box = el.getBoundingClientRect(), x = xMin + (ev.clientX - box.left - rand.l) / (B - rand.l - rand.r) * (xMax - xMin);
    const p0 = naechster(c.reihen[0].punkte, x);
    faden.setAttribute("x1", sx(p0.x)); faden.setAttribute("x2", sx(p0.x));
    tipp.zeige(ev.clientX, ev.clientY, c.hoverTitel ? c.hoverTitel(p0.x) : String(p0.x),
      c.reihen.map(x_ => ({ name: x_.name, wert: (c.wertText || eur)(naechster(x_.punkte, p0.x).y), farbe: x_.farbe })));
  });
  fang.addEventListener("pointerleave", () => { faden.setAttribute("x1", -9); faden.setAttribute("x2", -9); tipp.weg(); });
}

        <i class="db-teil klein" data-teil="kurz" style="--f:var(--kurz)"></i><i class="db-teil klein" data-teil="mittel" style="--f:var(--mittel)"></i><i class="db-teil klein" data-teil="lang" style="--f:var(--lang)"></i><b class="db-spaeter"></b></div>`;

        <p class="db-kzahl">${Z_(0)} <small>${Z_(0, "pct")} vom Netto</small></p><p class="db-ktext"></p><p class="klein">${text}</p></div>`;
    return kopf(f, "Die Drittel-Regel", `Eine Faustregel, kein Muss: je ein Drittel fürs Wohnen, fürs Leben und für später.`, this.schritte > 1 ? stufen(["Heute", "Mit Vorschlag"]) : "")
      + `<div class="db"><div class="db-netto ein"><p class="etikett">Netto im Monat</p><p class="zahl-gross">${Z_(h.netto)}</p><p class="klein">Ein Drittel sind ${eur(d)}.</p></div>
        <div class="db-zeilen">
          <div class="db-zeile ein" style="--i:1"><p class="db-name">Faustregel</p><div class="db-balken regel"><i>Wohnen <b>${eur(d)}</b></i><i>Leben <b>${eur(d)}</b></i><i>Leben später <b>${eur(d)}</b></i></div></div>
          <div class="db-zeile ein" style="--i:2"><p class="db-name">Bei ${du("dir", "euch")} heute</p>${balken("heute")}</div>

        </div>
        <div class="db-karten">${karte("wohnen", "Wohnen", 4, "Miete oder Rate, warm")}${karte("leben", "Leben", 5, "Alles andere: Alltag, Freizeit, Versicherungen, Kredite")}${karte("spaeter", "Leben später", 6, "Sparen in den drei Töpfen: kurz, mittel, lang")}</div></div>`;
  },
  setze(el, id, w, drittel) {
    const b = $("#db-" + id, el); if (!b) return;
    const p = { wohnen: w.wohnen, leben: w.leben, kurz: w.s.kurz, mittel: w.s.mittel, lang: w.s.lang };
    $$(".db-teil", b).forEach(t => { const anteil = drittel ? ({ wohnen: 1 / 3, leben: 1 / 3 }[t.dataset.teil] ?? 1 / 9) : Math.max(0, p[t.dataset.teil]) / w.netto;
      t.style.flexBasis = (anteil * 100).toFixed(2) + "%"; const lab = $("b", t); if (lab) lab.textContent = drittel ? "" : pct(p[t.dataset.teil] / w.netto * 100); });
    $(".db-spaeter", b).textContent = drittel ? "" : pct(w.spaeter / w.netto * 100);

  karten(el, w, heute) {

  },
  schritt(el, n) { const h = this.werte("heute"), v = this.werte("vorschlag"); this.setze(el, "vorschlag", n ? v : h, false); this.karten(el, n ? v : h, h); }
});

/* ---------- 3 Heute aufgestellt ---------- */

          <div class="ha-skala"><div class="ha-skala-spur">${Array.from({ length: 10 }, (_, i) => `<i class="${i + 1 === rp ? "an" : ""}">${i + 1}</i>`).join("")}<em id="ha-zeiger"></em></div><div class="ha-skala-text"><span>Sicherheit zuerst</span><span>Schwankungen sind in Ordnung</span></div></div></section>` : ""}</div>`;

/* ---------- 4 Einkommen heute und im Alter ---------- */
FOLIEN.push({ id: "einkommen", nr: 4, termin: "Konzept", titel: "Einkommen", kachel: ["Einkommen", "Vom Brutto bis zum Bedarf im Alter"],
  schritte: 2, t: 0,
  abzuege: () => [
    { id: "steuer", name: "Steuer", wert: F.Steuer || 0, farbe: "var(--abzug)" },
    { id: "av", name: "Arbeitslosenversicherung", wert: F.AbgabenAV || 0, farbe: "var(--abzug-2)" },
    { id: "kvpv", name: "Kranken- und Pflegeversicherung", wert: F.AbgabenKVPV || 0, farbe: "var(--abzug-2)" },
    { id: "rv", name: "Rentenversicherung", wert: F.AbgabenRV || 0, farbe: "var(--abzug-2)" }
  ].filter(x => x.wert > 0),
  farbe: { bu: "var(--einkommen)", sparen: "var(--tinte-3)", leben: "var(--leben)", kredit: "var(--abzug-2)", wohnen: "var(--wohnen)", risiken: "var(--basisrisiken)", rest: "var(--linie-2)" },
  render(f) {
    return kopf(f, `Wohin ${du("dein", "euer")} Einkommen fließt`, `Erst heute, dann der Blick nach vorn: Was davon ${du("brauchst du", "braucht ihr")} im Alter noch?`, stufen(["Heute", "Im Alter"]))
      + `<div class="fl"><div class="fl-bild" id="fl-bild"></div><div class="fl-liste" id="fl-liste"></div><p class="fazit fl-fazit ein" style="--i:5" id="fl-fazit"></p></div>`;
  },
  messen(el) { const feld = $("#fl-bild", el); feld.innerHTML = ""; this.mass = { B: feld.clientWidth, H: feld.clientHeight }; },
  zeichne(el, t, auf) {
    const feld = $("#fl-bild", el), { B, H } = this.mass, r = rem();
    const brutto = F.Brutto || R.netto(), netto = R.netto(), abz = this.abzuege();
    const verw = R.verwendung().map(v => ({ ...v, wert: v.heute + (v.alter - v.heute) * t }));
    const summeC = R.summe(verw, v => v.wert), sparH = R.sparraten("heute");
    this.liste(el, t, abz, verw, brutto, netto, summeC);
    if (B < 640 || H < 200) { feld.innerHTML = ""; return; }
    const nb = 0.8 * r, lue = 0.6 * r, oben = 3.5 * r, unten = 0.4 * r;
    const xA = 0.2 * r, xB = B * 0.36, xC = B * 0.71, nB = abz.length + 1;
    const s = (H - oben - unten - (nB - 1) * lue) / brutto, alpha = 1 - 0.68 * t;
    const band = (x0, y0a, y0b, x1, y1a, y1b, farbe, deck) => { const m = (x0 + x1) / 2;
      return `<path d="M${x0} ${y0a}C${m} ${y0a} ${m} ${y1a} ${x1} ${y1a}L${x1} ${y1b}C${m} ${y1b} ${m} ${y0b} ${x0} ${y0b}Z" fill="${farbe}" opacity="${deck}"/>`; };
    let svg = `<svg class="chart" width="${B}" height="${H}" viewBox="0 0 ${B} ${H}" role="img" aria-label="Einkommen: vom Brutto zur Verwendung"><defs><clipPath id="fl-clip"><rect x="0" y="0" width="${(B * auf).toFixed(1)}" height="${H}"/></clipPath></defs><g clip-path="url(#fl-clip)">`;
    /* Spalte A: Brutto, Spalte B: Abzüge und Netto */
    let yA = oben, yB = oben, nettoY = 0; const hA = brutto * s;
    svg += `<g opacity="${alpha}"><rect x="${xA}" y="${oben}" width="${nb}" height="${hA}" rx="3" fill="var(--tinte)"/>`;
    [...abz, { id: "netto", name: "Netto", wert: netto, farbe: "var(--tinte)" }].forEach(k => {
      const h = Math.max(2, k.wert * s);
      svg += band(xA + nb, yA, yA + k.wert * s, xB, yB, yB + h, k.id === "netto" ? "var(--tinte)" : k.farbe, k.id === "netto" ? 0.1 : 0.3);
      svg += `<rect x="${xB}" y="${yB}" width="${nb}" height="${h}" rx="3" fill="${k.farbe}"/>`;
      if (k.id === "netto") nettoY = yB;
      else svg += `<text class="fl-t" x="${xB + nb + 0.6 * r}" y="${yB + h / 2}" dy=".34em"><tspan class="fl-w">${eur(k.wert)}</tspan> ${esc(k.name)}</text>`;
      yA += k.wert * s; yB += h + lue;
    });
    svg += `<text class="fl-kopf" x="${xA}" y="${oben - 2.3 * r}">${F.Brutto ? "Brutto" : "Netto"} im Monat</text><text class="fl-gross" x="${xA}" y="${oben - 0.6 * r}">${eur(brutto)}</text></g>`;
    /* Spalte C: Verwendung heute, wird zu Bedarf im Alter */
    const hoehen = verw.map(v => v.wert * s), abst = hoehen.map(h => lue * Math.min(1, h / 3));
    const gesamtC = R.summe(hoehen, h => h) + R.summe(abst.slice(0, -1), a => a);
    let yC = Math.min(H - unten - gesamtC, Math.max(oben + 0.9 * r, nettoY + netto * s / 2 - gesamtC / 2)), yQ = nettoY, letzteY = -99;
    verw.forEach((v, i) => {
      const h = hoehen[i], sicht = Math.min(1, v.wert / 20);
      if (h > 0.2) {
        svg += band(xB + nb, yQ, yQ + h, xC, yC, yC + h, this.farbe[v.id], 0.3 * sicht);
        if (v.id === "sparen") { let y = yC; const ges = sparH.kurz + sparH.mittel + sparH.lang || 1;
          R.TOEPFE.forEach(tp => { const th = h * sparH[tp] / ges; if (th > 0.1) svg += `<rect x="${xC}" y="${y}" width="${nb}" height="${th}" fill="var(--${tp})"/>`; y += th; }); }
        else svg += `<rect x="${xC}" y="${yC}" width="${nb}" height="${Math.max(1.5, h)}" rx="2" fill="${this.farbe[v.id]}"/>`;
        const ty = Math.max(yC + h / 2, letzteY + 1.25 * r); letzteY = ty;
        svg += `<text class="fl-t" x="${xC + nb + 0.6 * r}" y="${ty}" dy=".34em" opacity="${sicht}"><tspan class="fl-w">${eur(v.wert)}</tspan> ${esc(v.name)}</text>`;
      }
      yQ += h; yC += h + abst[i];
    });
    svg += `<text class="fl-kopf" x="${xB + nb + 0.6 * r}" y="${nettoY + 1.25 * r}" opacity="${alpha}">Netto <tspan class="fl-w">${eur(netto)}</tspan></text>`;
    svg += `<text class="fl-kopf" x="${xC}" y="${oben - 2.3 * r}">${t < 0.5 ? `Dafür ${du("nutzt du", "nutzt ihr")} es heute` : `Das ${du("brauchst du", "braucht ihr")} im Alter`}</text><text class="fl-gross" x="${xC}" y="${oben - 0.6 * r}">${eur(summeC)}</text></g></svg>`;
    feld.innerHTML = svg;
  },
  liste(el, t, abz, verw, brutto, netto, summeC) {            // dieselben Zahlen als Liste: am Handy statt des Bildes, sonst als Tabelle für Screenreader
    const alt = t >= 0.5, zeile = (name, wert, farbe, max, weg) => `<li class="${weg ? "weg" : ""}"><span>${esc(name)}</span><i><u style="width:${Math.max(0, Math.min(100, wert / max * 100))}%;background:${farbe}"></u></i><b>${eur(wert)}</b></li>`;
    $("#fl-liste", el).innerHTML = (alt ? "" : `${F.Brutto ? `<p class="fl-lkopf"><span>Brutto im Monat</span><b>${eur(brutto)}</b></p><ul>${abz.map(a => zeile(a.name, a.wert, a.farbe, brutto)).join("")}</ul>` : ""}`)
      + `<p class="fl-lkopf"><span>${alt ? `Das ${du("brauchst du", "braucht ihr")} im Alter` : "Netto"}</span><b>${eur(alt ? summeC : netto)}</b></p><ul>${verw.map(v => zeile(v.name, alt ? v.alter : v.heute, this.farbe[v.id] === "var(--tinte-3)" ? "var(--lang)" : this.farbe[v.id], netto, alt && v.alter < 1)).join("")}</ul>`;
  },
  fazit(el, n) {
    const verw = R.verwendung(), weg = verw.filter(v => v.heute >= 1 && v.alter < 1).map(v => v.name);
    $("#fl-fazit", el).textContent = n
      ? `Im Alter ${weg.length ? `${weg.length === 1 ? "fällt" : "fallen"} weg: ${weg.join(", ")}. ` : ""}Es bleiben ${eur(R.bedarf())} im Monat, die ${du("du brauchst", "ihr braucht")}, gerechnet in heutiger Kaufkraft. Steuer und Krankenversicherung auf die Rente kommen dazu. Das rechnen wir bei der Rentenlücke.`
      : `${F.Brutto ? `Von ${eur(F.Brutto)} Brutto kommen ${eur(R.netto())} an` : `Im Monat kommen ${eur(R.netto())} netto an`}. Davon ${R.sparSumme("heute") >= 1 ? `gehen heute ${eur(R.sparSumme("heute"))} in den Vermögensaufbau` : "geht heute noch nichts in den Vermögensaufbau"}.`;
  },
  betreten(el, schritt) {
    this.t = schritt ? 1 : 0; this.fazit(el, schritt); this.messen(el);
    this.lauf && this.lauf.stop(); this.lauf = tween(1100, p => this.zeichne(el, this.t, p));
  },
  schritt(el, n) {
    const von = this.t, nach = n ? 1 : 0; this.fazit(el, n);
    this.lauf && this.lauf.stop(); this.lauf = tween(1000, p => { this.t = von + (nach - von) * p; this.zeichne(el, this.t, 1); });
  },
  rechne(el) { this.lauf && this.lauf.stop(); this.t = Math.round(this.t); this.messen(el); this.zeichne(el, this.t, 1); }
});

    const sH = R.summe(b, x => x.heute), sV = R.summe(b, x => x.vorschlag), gehalt = DATEN.vertraege.some(v => v.UeberGehalt && v.Status === "aktiv");
    return kopf(f, "Alle Bereiche auf einen Blick", `Was ${du("du", "ihr")} im Monat für Absicherung und Vermögen ${du("ausgibst", "ausgebt")}. Ein Klick auf eine Zeile öffnet den Bereich.`, HAT_VORSCHLAG ? stufen(["Heute", "Vorschlag"]) : "")
      + `<div class="ub"><div class="ub-kopf"><span></span><span></span><span class="ub-h">Heute</span><span class="ub-v">Vorschlag</span><span></span></div>
        <p class="ub-gruppe">Vorsorge</p>${b.slice(0, 3).map(zeile).join("")}<p class="ub-gruppe">Vermögen</p>${b.slice(3).map((x, i) => zeile(x, i + 3)).join("")}
        <div class="ub-zeile ub-summe ein" style="--i:6"><span class="ub-name"><b>Zusammen im Monat</b></span><span class="ub-spur"></span><span class="ub-wert ub-h">${Z_(sH)}</span>
          <span class="ub-wert ub-v"><b class="zahl" data-format="eur" data-von="${sH}" data-nach="${sV}">${eur(sH)}</b><em class="delta">${mitVorzeichen(sV - sH)}</em></span><span></span></div>

/* ---------- 6 Bereiche im Detail: Gesundheit, Basisrisiken, Einkommen absichern ---------- */
const VARIANTE = { guenstig: "Günstig", "Preis-Leistung": "Preis-Leistung", Top: "Top", heute: "Heute", Vorschlag: "Vorschlag" };
const STUFE = [
  `<span class="st st-0" role="img" aria-label="nicht erfüllt"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6.5 10h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>`,
  `<span class="st st-1" role="img" aria-label="eingeschränkt"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 2a8 8 0 0 0 0 16Z" fill="currentColor"/></svg></span>`,
  `<span class="st st-2" role="img" aria-label="erfüllt"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M5.8 10.4l2.9 2.9 5.6-6.2" fill="none" stroke="var(--flaeche)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`
];
function bereichFolie(id, bereich, name, titel, lead) {
  const zeilen = R.zeilen(bereich); if (!zeilen.length) return;
  const farbe = BEREICH[bereich].farbe, vgl = v => v && DATEN.vergleiche.find(x => x.VertragId === v.VertragId);
  const artText = { neu: "Neu", wechsel: "Wechsel", bleibt: "Bleibt" };
  const seite = v => `<div class="bd-oben"><p class="bd-wer"><b>${esc(v.Gesellschaft || "")}</b>${v.Tarif ? ` <span>${esc(v.Tarif)}</span>` : ""}</p>
      <p class="bd-beitrag"><b>${eurGenau(R.proMonat(v))}</b> im Monat${v.MaxBeitrag ? ` <small>höchstens ${eurGenau(v.MaxBeitrag)}</small>` : ""}${v.Zahlweise === "jaehrlich" ? ` <small>${eurGenau(v.Beitrag)} im Jahr</small>` : ""}</p></div>
      ${v.KonditionenKurz ? `<p class="bd-kond">${esc(v.KonditionenKurz)}</p>` : ""}${v.Hinweis ? `<p class="bd-hinweis">${esc(v.Hinweis)}</p>` : ""}`;
  FOLIEN.push({ id, nr: 6, termin: "Konzept", titel: name, bereich, schritte: zeilen.some(z => z.vorschlag) ? 2 : 1, wahl: null,
    kachel: [name, [...new Set(zeilen.map(z => (z.heute || z.vorschlag).Sparte))].join(", ")],
    render(f) {
      const liste = zeilen.map((z, i) => { const v = z.vorschlag, basis = z.heute || v, kannVgl = !!vgl(v);
        const diff = v ? R.proMonat(v) - (z.heute ? R.proMonat(z.heute) : 0) : 0;
        const titelzeile = `<header><strong>${esc(basis.Sparte)}</strong>${basis.Person ? `<span class="person">${esc(basis.Person)}</span>` : ""}<span class="bd-art">${artText[z.art]}</span></header>`;
        if (z.art === "bleibt") return `<article class="bd-zeile bleibt ein" style="--i:${i}">${titelzeile}<div class="bd-eins">${seite(z.heute)}</div></article>`;
        return `<article class="bd-zeile ein ${z.art}${kannVgl ? " waehlbar" : ""}" style="--i:${i}" ${kannVgl ? `data-vertrag="${esc(v.VertragId)}" tabindex="0" role="button" aria-label="Vergleich zu ${esc(basis.Sparte)} zeigen"` : ""}>${titelzeile}
          <div class="bd-heute"><p class="etikett">Heute</p>${z.heute ? seite(z.heute) : `<p class="bd-leer">Bisher nichts</p>`}</div>
          <div class="bd-pfeil" aria-hidden="true">→</div>
          <div class="bd-neu"><p class="etikett">Vorschlag</p>${seite(v)}<p class="bd-diff">${Math.abs(diff) < 0.005 ? "Beitrag bleibt gleich" : mitVorzeichen(diff, eurGenau) + " im Monat"}${kannVgl ? `<span class="bd-mehr">Warum dieser?</span>` : ""}</p></div></article>`; }).join("");
      return kopf(f, titel, lead, this.schritte > 1 ? stufen(["Heute", "Vorschlag"]) : "")
        + `<div class="bd" style="--f:var(--${farbe})"><div class="bd-liste">${liste}${faktenbox(id)}</div><div class="bd-seite"><div class="bd-vgl" id="vgl-${id}"></div></div></div>`;
    },
    vergleich(el, vertragId) {
      const v = DATEN.vertraege.find(x => x.VertragId === vertragId), g = vgl(v), ziel = $("#vgl-" + id, el);
      this.wahl = vertragId; $$(".bd-zeile", el).forEach(z => z.classList.toggle("gewaehlt", z.dataset.vertrag === vertragId));
      if (!g) { ziel.innerHTML = ""; return; }
      const n = g.Tarife.length, zelle = (w, t) => `<div class="vgl-z${t.Gewaehlt ? " gew" : ""}">${typeof w === "number" ? STUFE[w] || "" : esc(w)}</div>`;
      ziel.innerHTML = `<section class="vgl" style="--n:${n}"><p class="etikett">Warum dieser · ${esc(v.Sparte)}${v.Person ? " " + esc(v.Person) : ""}</p>
        <div class="vgl-rahmen"><div class="vgl-tab">
          <div class="vgl-k"></div>${g.Tarife.map(t => `<div class="vgl-z vgl-kopf${t.Gewaehlt ? " gew" : ""}"><small>${esc(VARIANTE[t.Variante] || t.Variante || "")}</small><b>${esc(t.Gesellschaft)}</b>${t.Tarif ? `<span>${esc(t.Tarif)}</span>` : ""}</div>`).join("")}
          <div class="vgl-k">Beitrag im Monat</div>${g.Tarife.map(t => `<div class="vgl-z vgl-preis${t.Gewaehlt ? " gew" : ""}"><b>${eurGenau(t.Beitrag)}</b>${t.MaxBeitrag ? `<small>höchstens ${eurGenau(t.MaxBeitrag)}</small>` : ""}</div>`).join("")}
          ${g.Kriterien.map((k, i) => `<div class="vgl-k">${esc(k)}</div>${g.Tarife.map(t => zelle(t.Werte[i], t)).join("")}`).join("")}
        </div></div>
        ${g.Tarife.some(t => t.Werte.some(w => typeof w === "number")) ? `<p class="vgl-leg">${STUFE[2]} erfüllt ${STUFE[1]} eingeschränkt ${STUFE[0]} nicht erfüllt</p>` : ""}
        <ul class="vgl-warum">${(g.Warum || []).map(w => `<li>${esc(w)}</li>`).join("")}</ul>
        <p class="klein">Den ganzen Markt- und Leistungsvergleich ${du("bekommst du", "bekommt ihr")} per Mail.</p></section>`;
    },
    betreten(el, n) { this.wahl = null; this.schritt(el, n); },
    schritt(el, n) {
      const erste = zeilen.find(z => vgl(z.vorschlag));
      if (n && erste) this.vergleich(el, this.wahl || erste.vorschlag.VertragId); else { $("#vgl-" + id, el).innerHTML = ""; $$(".bd-zeile", el).forEach(z => z.classList.remove("gewaehlt")); }
    },
    klick(el, ev) {
      const z = ev.target.closest(".bd-zeile.waehlbar"); if (!z) return false;
      if (+el.dataset.schritt < 1) setzeSchritt(1);
      this.vergleich(el, z.dataset.vertrag); return true;
    }
  });
}
bereichFolie("gesundheit", "Gesundheit", "Gesundheit", "Gesundheit", `Krankenkasse und was ${du("du", "ihr")} zusätzlich ${du("absicherst", "absichert")}.`);
bereichFolie("basisrisiken", "Basisrisiken", "Basisrisiken", "Basisrisiken", `Die Versicherungen für den Alltag: Haftpflicht, Hausrat, Auto.`);
bereichFolie("arbeitskraft", "Einkommen", "Einkommen absichern", "Einkommen absichern", `Was passiert, wenn ${du("du", "einer von euch")} länger nicht arbeiten ${du("kannst", "kann")}?`);

FOLIEN.push({ id: "toepfe", nr: 7, termin: "Konzept", titel: "Drei Töpfe", kachel: ["Drei Töpfe", "Kurz, mittel, lang: wer bekommt wie viel"],

        <ul class="tp-wege tp-h">${zz.filter(z => z.heute).map(z => weg(z.heute)).join("") || `<li class="leer">Noch nichts eingerichtet</li>`}</ul>

    const sH = h.kurz + h.mittel + h.lang, sV = v.kurz + v.mittel + v.lang;
    return kopf(f, "Drei Töpfe für drei Zeiträume", `Jeder Euro fürs Sparen bekommt eine Aufgabe: bald gebraucht, für größere Wünsche oder für die Rente.`, this.schritte > 1 ? stufen(["Heute", "Vorschlag"]) : "")
      + `<div class="tp"><div class="tp-toepfe">${R.TOEPFE.map(topf).join("")}</div>
        <p class="tp-summe ein" style="--i:4"><span>Zusammen im Monat</span><b class="zahl" data-format="eur" data-von="${sH}" data-nach="${sV}">${eur(sH)}</b>
          <span>das sind <b class="zahl" data-format="pct" data-von="${netto ? sH / netto * 100 : 0}" data-nach="${netto ? sV / netto * 100 : 0}">${pct(netto ? sH / netto * 100 : 0)}</b> vom Netto</span></p></div>`;

  betreten(el, n) { $$(".zahl[data-von]", el).forEach(z => { z._wert = 0; }); $$(".tp-fuellung", el).forEach(x => { x.style.height = "0%"; }); void el.offsetWidth; this.schritt(el, n); },
