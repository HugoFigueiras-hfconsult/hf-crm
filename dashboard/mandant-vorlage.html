  }
});

/* ---------- 7b Vermögensaufbau ---------- */
FOLIEN.push({ id: "vermoegensaufbau", nr: 7, termin: "Konzept", titel: "Vermögensaufbau", kachel: ["Vermögensaufbau", "Wie die Töpfe wachsen und wofür sie da sind"],
  feldName: { kurz: "sparKurz", mittel: "sparMittel", lang: "sparLang" },
  render(f) {
    const feld = (t, i) => `<figure class="va-feld ein" style="--tf:var(--${t});--i:${i}"><figcaption><p class="etikett">${TOPF[t].phase}</p><h2><span class="topfmarke">${TOPF[t].name}</span> <span id="va-${t}-rate"></span></h2></figcaption>
        <div class="va-chart" id="va-${t}"></div><div class="va-text" id="va-${t}-text"></div></figure>`;
    return kopf(f, `So wachsen ${du("deine", "eure")} drei Töpfe`, `${HAT_VORSCHLAG ? "Mit den Sparraten aus dem Vorschlag" : "Mit den heutigen Sparraten"}. Aus kurz und mittel ${du("nimmst du", "nehmt ihr")} das Geld für ${du("deine", "eure")} Ziele wieder heraus.`)
      + `<div class="va"><div class="va-felder">${R.TOEPFE.map(feld).join("")}</div>
        <div class="va-unten"><div class="reglerreihe">${regler("va", "sparKurz", "f-kurz")}${regler("va", "sparMittel", "f-mittel")}${regler("va", "sparLang", "f-lang")}${regler("va", "rendite")}</div>
          <div class="va-neben">${kaufkraftSchalter("va")}${ruecksetzen("va")}</div></div>
        <p class="annahmen" id="va-annahmen"></p></div>`;

          <section class="ns-spalte"><h2>Bei mir</h2><ul class="ns-liste">${liste(w => w !== "Mandant")}</ul></section></div></div>`;
  }
});

/* ---------- 10 Verlauf ---------- */
FOLIEN.push({ id: "verlauf", nr: 10, termin: "Update", titel: "Verlauf", kachel: ["Verlauf", "Depot, Ziele, Termine, Neues"],
  render(f) {
    const st = [...DATEN.depotstaende].sort((a, b) => a.Stichtag.localeCompare(b.Stichtag)), l = st[st.length - 1];
    const erreicht = DATEN.ziele.filter(z => z.Status === "erreicht"), plus = l ? l.Gesamtwert - (l.Einzahlungen || 0) : 0;
    const termine = [...DATEN.termine].sort((a, b) => a.Beginn.localeCompare(b.Beginn));
    return kopf(f, "Was seitdem passiert ist", `Der Verlauf über die Zeit: Depot, erreichte Ziele, Termine und was sich geändert hat.`)
      + `<div class="vl"><section class="vl-depot">${l ? `<div class="vl-zahlen"><div class="kz ein"><p class="kz-name"><i class="punkt" style="--f:var(--mittel)"></i>Depotwert</p><p class="zahl-gross">${Z_(l.Gesamtwert)}</p><p class="klein">Stand ${datumKurz(l.Stichtag)}</p></div>
            ${l.Einzahlungen != null ? `<div class="kz ein" style="--i:1"><p class="kz-name">Eingezahlt</p><p class="zahl-gross">${Z_(l.Einzahlungen)}</p><p class="klein">seit Beginn</p></div>
            <div class="kz ein" style="--i:2"><p class="kz-name">Wertzuwachs</p><p class="zahl-gross">${plus < 0 ? "−" : ""}${Z_(Math.abs(plus))}</p><p class="klein">${l.Einzahlungen ? mitVorzeichen(plus / l.Einzahlungen * 100, x => pct(x, 1)) + " auf die Einzahlungen" : ""}</p></div>` : ""}</div>
          ${st.length > 1 ? legende([{ name: "Depotwert", farbe: "var(--mittel)" }, { name: "Eingezahlt", farbe: "var(--tinte-3)", art: "punkte" }]) + `<div class="vl-chart" id="vl-chart"></div>` : ""}
          ${l.positionen && l.positionen.length ? `<ul class="vl-pos">${l.positionen.map((p, i) => `<li class="ein" style="--i:${i + 3}"><span>${esc(p.Bezeichnung)}</span><i><u style="width:${p.Anteil ?? p.Wert / l.Gesamtwert * 100}%"></u></i><b>${eur(p.Wert)}</b><small>${pct(p.Anteil ?? p.Wert / l.Gesamtwert * 100)}</small></li>`).join("")}</ul>` : ""}` : `<p class="leer">Noch kein Depotstand. Der Verlauf beginnt mit dem ersten Stichtag.</p>`}</section>
        <div class="vl-seite">
          <section><h2>Erreichte Ziele</h2><ul class="vl-liste">${erreicht.map(z => `<li class="ein"><i class="haken-kreis" style="--f:var(--${z.Topf})"></i><span>${esc(z.Beschreibung)}<small>${z.Jahr || ""}${z.Betrag ? " · " + eur(z.Betrag) : ""}</small></span></li>`).join("") || `<li class="leer">Kommt mit der Zeit</li>`}</ul></section>
          <section><h2>Termine</h2><ol class="vl-termine">${termine.map(t => `<li class="${t.TerminId === DATEN.meta.AktuellerTerminId ? "jetzt" : t.Status === "geplant" ? "offen" : "war"}"><b>${esc(t.Art)}</b><small>${datumKurz(t.Beginn)}</small>${t.Ergebnisse ? `<span>${esc(t.Ergebnisse)}</span>` : t.TerminId === DATEN.meta.AktuellerTerminId ? `<span>heute</span>` : ""}</li>`).join("")}</ol></section>
          ${DATEN.neuerungen && DATEN.neuerungen.length ? `<section><h2>Neu und für ${du("dich", "euch")} wichtig</h2><ul class="vl-neu">${DATEN.neuerungen.map(n => `<li><b>${esc(n.Titel)}</b>${n.GiltAb ? `<small>ab ${datumKurz(n.GiltAb)}</small>` : ""}<span>${esc(n.Kurzfassung)}</span></li>`).join("")}</ul></section>` : ""}
        </div></div>`;
  },
  betreten(el) {
    const st = [...DATEN.depotstaende].sort((a, b) => a.Stichtag.localeCompare(b.Stichtag)), ziel = $("#vl-chart", el); if (!ziel || st.length < 2) return;
    const t0 = tag(st[0].Stichtag).getTime(), x = s => Math.round((tag(s.Stichtag).getTime() - t0) / 864e5), l = st[st.length - 1];
    const jede = Math.ceil(st.length / 6);
    linienChart(ziel, { titel: "Depotwert und Einzahlungen", xMarken: st.filter((s, i) => i % jede === 0 || i === st.length - 1).map((s, i) => ({ x: x(s), text: monatJahr(s.Stichtag), anker: i === 0 ? "start" : "middle" })),
      reihen: [{ name: "Depotwert", farbe: "var(--mittel)", flaeche: true, ende: eur(l.Gesamtwert), punkte: st.map(s => ({ x: x(s), y: s.Gesamtwert })) }]
        .concat(st.every(s => s.Einzahlungen != null) ? [{ name: "Eingezahlt", farbe: "var(--tinte-3)", gestrichelt: true, ende: eur(l.Einzahlungen), punkte: st.map(s => ({ x: x(s), y: s.Einzahlungen })) }] : []),
      marker: st.map(s => ({ x: x(s), y: s.Gesamtwert, farbe: "var(--mittel)" })), hoverTitel: tage => new Date(t0 + tage * 864e5).toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" }) });
  },
  rechne(el) { this.betreten(el); }
});

/* ---------- Zum Schluss: Empfehlungen (über DATEN.optionen.empfehlungsfolie ein- und ausschaltbar) ---------- */
FOLIEN.push({ id: "empfehlungen", titel: "Zum Schluss", kachel: ["Zum Schluss", "Wie man zu mir kommt"],
  render() {
    const von = M.EmpfohlenVonAnzeige || M.EmpfohlenVonText;
    return `<div class="emp"><div class="emp-zeichen ein" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="emp-satz ein" style="--i:2">Zu mir kommt man fast immer über Empfehlungen${von ? `, so wie ${du("du", "ihr")} über ${esc(von)}` : ""}.</p>
      <p class="emp-zweiter ein" style="--i:6">Wenn ${du("dir", "euch")} jemand einfällt, dem das auch hilft: Ich schick ${du("dir", "euch")} einen kurzen Text zum Weiterleiten.</p>
      <p class="emp-dank ein" style="--i:10">Danke für ${du("deine", "eure")} Zeit.</p></div>`;
  }
});

/* =====================================================================================
   6. BÜHNE  –  Folien aufbauen, Navigation, Tastatur, Sprungadressen, Präsentationsmodus
   ===================================================================================== */
const app = $("#app"), buehne = $("#buehne");
const merke = (k, v) => { try { localStorage.setItem("artefakt-" + k, v); } catch (e) { /* ohne Speicher geht es auch */ } };
const gemerkt = k => { try { return localStorage.getItem("artefakt-" + k); } catch (e) { return null; } };

{ /* ausgeblendete Folien entfernen */
  const weg = new Set(DATEN.optionen.ausgeblendet || []);
  if (!DATEN.optionen.empfehlungsfolie) weg.add("empfehlungen");
  for (let i = FOLIEN.length - 1; i > 0; i--) if (weg.has(FOLIEN[i].id)) FOLIEN.splice(i, 1);
}
let aktuell = -1, schrittJetzt = 0;
const elVon = f => $("#f-" + f.id);
const stufenAn = el => $$(".stufen button", el).forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.schritt === schrittJetzt)));

function baue() {
  $("#folien").innerHTML = FOLIEN.map(f => `<section class="folie f-${f.id}" id="f-${f.id}" data-schritt="0" aria-label="${esc(f.titel)}" hidden>${f.render(f)}</section>`).join("");
  $("#fortschritt").innerHTML = FOLIEN.map((f, i) => `<button type="button" class="fp${i && f.nr !== FOLIEN[i - 1].nr ? " neu" : ""}" data-index="${i}" title="${f.nr ? "Kapitel " + f.nr + ": " : ""}${esc(f.titel)}" aria-label="${esc(f.titel)}"><i></i></button>`).join("");
  $("#kopf-name").textContent = NAME;
  $("#kopf-test").hidden = $("#fuss-test").hidden = !DATEN.meta.Testdaten;
}

function zeige(index, { schritt = 0, hash = true, still = false } = {}) {
  index = Math.max(0, Math.min(FOLIEN.length - 1, index));
  const f = FOLIEN[index], el = elVon(f), max = (f.schritte || 1) - 1;
  if (aktuell >= 0 && aktuell !== index) elVon(FOLIEN[aktuell]).hidden = true;
  tipp.weg();
  aktuell = index; schrittJetzt = schritt === "letzter" ? max : Math.min(max, schritt);
  el.classList.toggle("still", still); el.dataset.schritt = schrittJetzt; el.hidden = false; buehne.scrollTop = 0;
  stufenAn(el); zaehleAlle(el);
  if (f.betreten) f.betreten(el, schrittJetzt); else if (f.rechne) f.rechne(el, false);
  $("#kopf-kapitel").textContent = f.nr ? `Kapitel ${f.nr} · ${f.titel}` : "";
  $("#fuss-titel").textContent = f.nr ? `${f.nr} · ${f.titel}` : f.titel;
  $("#zaehler").textContent = `${index + 1} / ${FOLIEN.length}`;
  $$(".fp").forEach((b, i) => { b.classList.toggle("war", i < index); b.classList.toggle("jetzt", i === index); });
  $("#btn-zurueck").disabled = index === 0; $("#btn-weiter").disabled = index === FOLIEN.length - 1 && schrittJetzt >= max;
  if (hash && location.hash.slice(1) !== f.id && (index > 0 || location.hash)) { try { location.hash = f.id; } catch (e) { /* in manchen Rahmen gesperrt */ } }
}
function setzeSchritt(n) {
  const f = FOLIEN[aktuell], el = elVon(f), max = (f.schritte || 1) - 1; n = Math.max(0, Math.min(max, n));
  if (n === schrittJetzt) return;
  schrittJetzt = n; el.dataset.schritt = n; stufenAn(el); f.schritt && f.schritt(el, n);
  $("#btn-weiter").disabled = aktuell === FOLIEN.length - 1 && n >= max;
}
const weiter = () => { const f = FOLIEN[aktuell]; if (schrittJetzt < (f.schritte || 1) - 1) setzeSchritt(schrittJetzt + 1); else if (aktuell < FOLIEN.length - 1) zeige(aktuell + 1); };
const zurueck = () => { if (schrittJetzt > 0) setzeSchritt(schrittJetzt - 1); else if (aktuell > 0) zeige(aktuell - 1, { schritt: "letzter" }); };
const neuRechnen = () => { const f = FOLIEN[aktuell]; if (f && f.rechne) f.rechne(elVon(f), true); };

/* Kachel zoomt zur Folie auf, und beim Zurückspringen wieder zur Kachel */
function zoom(von, nach, danach, inhalt) {
  const z = $("#zoom"), setze = r => Object.assign(z.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  z.innerHTML = inhalt ? `<div class="zoom-inhalt">${inhalt}</div>` : "";
  z.style.transition = "none"; z.style.opacity = "1"; setze(von); z.hidden = false; void z.offsetWidth;
  z.style.transition = "left .46s cubic-bezier(.3,.7,.2,1),top .46s cubic-bezier(.3,.7,.2,1),width .46s cubic-bezier(.3,.7,.2,1),height .46s cubic-bezier(.3,.7,.2,1)";
  setze(nach);
  setTimeout(() => { danach(); z.style.transition = "opacity .28s"; z.style.opacity = "0"; setTimeout(() => { z.hidden = true; z.innerHTML = ""; }, 300); }, 450);
}
function springe(id, vonEl) {
  const index = FOLIEN.findIndex(f => f.id === id); if (index < 0) return;
  if (!ANIM.an || !vonEl) return zeige(index);
  zoom(vonEl.getBoundingClientRect(), buehne.getBoundingClientRect(), () => zeige(index), vonEl.classList.contains("kachel") ? vonEl.innerHTML : "");
}
function zurUebersicht() {
  if (aktuell <= 0) return;
  const id = FOLIEN[aktuell].id;
  if (!ANIM.an) return zeige(0);
  zeige(0, { still: true });
  const kachel = $(`.kachel[data-ziel="${id}"]`);
  if (kachel) { kachel.scrollIntoView({ block: "nearest" }); zoom(buehne.getBoundingClientRect(), kachel.getBoundingClientRect(), () => {}, kachel.innerHTML); }
}

function praesentation(an) {
  app.classList.toggle("praes", an);
  const wurzel = document.documentElement;
  try {
    if (an && wurzel.requestFullscreen) { const p = wurzel.requestFullscreen(); p && p.catch && p.catch(() => {}); }
    else if (!an && document.fullscreenElement) { const p = document.exitFullscreen(); p && p.catch && p.catch(() => {}); }
  } catch (e) { /* Vollbild nicht erlaubt: die Ansicht ohne Kopfzeile bleibt */ }
  setTimeout(neuRechnen, 400);
}
function animationen(an, merken) {
  ANIM.an = an; document.documentElement.classList.toggle("ruhig", !an); $("#sch-anim").checked = an;
  if (merken) merke("animationen", an ? "an" : "aus");
}
function gleicheRegler() {
  $$("input[type=range][data-feld]").forEach(i => { i.value = ZU[i.dataset.feld]; });
  $$("output[data-feld]").forEach(o => { o.textContent = FELD[o.dataset.feld].f(ZU[o.dataset.feld]); });
  $$("[data-kaufkraft]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kaufkraft === ZU.kaufkraft)));
}

document.addEventListener("click", ev => {
  const t = ev.target, f = FOLIEN[aktuell];
  const ziel = t.closest("[data-ziel]"); if (ziel) return springe(ziel.dataset.ziel, ziel);
  const stufe = t.closest(".stufen button"); if (stufe) return setzeSchritt(+stufe.dataset.schritt);
  const kk = t.closest("[data-kaufkraft]"); if (kk) { ZU.kaufkraft = kk.dataset.kaufkraft; gleicheRegler(); return neuRechnen(); }
  if (t.closest("[data-reset]")) { ZU = startZustand(); gleicheRegler(); return neuRechnen(); }
  const fp = t.closest(".fp"); if (fp) return zeige(+fp.dataset.index);
  if (f && f.klick) f.klick(elVon(f), ev);
});
document.addEventListener("input", ev => {
  const i = ev.target; if (!i.matches || !i.matches("input[type=range][data-feld]")) return;
  ZU[i.dataset.feld] = +i.value; gleicheRegler(); neuRechnen();
});
$("#btn-weiter").addEventListener("click", weiter);
$("#btn-zurueck").addEventListener("click", zurueck);
$("#btn-start").addEventListener("click", zurUebersicht);
$("#btn-uebersicht").addEventListener("click", zurUebersicht);
$("#btn-praes").addEventListener("click", () => praesentation(!app.classList.contains("praes")));
$("#btn-praes-aus").addEventListener("click", () => praesentation(false));
$("#sch-anim").addEventListener("change", ev => animationen(ev.target.checked, true));
$("#btn-thema").addEventListener("click", () => {
  const w = document.documentElement, dunkel = w.dataset.theme ? w.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  w.dataset.theme = dunkel ? "light" : "dark"; neuRechnen();
});
document.addEventListener("keydown", ev => {
  if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
  const t = ev.target, k = ev.key, ist = s => !!(t.matches && t.matches(s)), imFeld = ist("input:not([type=checkbox]),select,textarea");
  if (imFeld && k !== "Escape") return;                                   // Pfeiltasten gehören dann dem Regler
  if (k === "ArrowRight" || k === "PageDown" || (k === " " && !ist("button,[role=button],input"))) { ev.preventDefault(); weiter(); }
  else if (k === "ArrowLeft" || k === "PageUp") { ev.preventDefault(); zurueck(); }
  else if (k === "Home") { ev.preventDefault(); zeige(0); }
  else if (k === "End") { ev.preventDefault(); zeige(FOLIEN.length - 1); }
  else if (k === "f" || k === "F") praesentation(!app.classList.contains("praes"));
  else if (k === "Escape") { if (imFeld) t.blur(); else if (app.classList.contains("praes") && !document.fullscreenElement) praesentation(false); else zurUebersicht(); }
  else if ((k === "Enter" || k === " ") && ist(".bd-zeile.waehlbar")) { ev.preventDefault(); t.click(); }
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) app.classList.remove("praes"); setTimeout(neuRechnen, 150); });
window.addEventListener("hashchange", () => { const i = FOLIEN.findIndex(f => f.id === decodeURIComponent(location.hash.slice(1))); if (i >= 0 && i !== aktuell) zeige(i, { hash: false }); });
{ let warte; window.addEventListener("resize", () => { clearTimeout(warte); warte = setTimeout(neuRechnen, 160); }); }

/* Start */
animationen(DATEN.optionen.animationen !== false && !matchMedia("(prefers-reduced-motion: reduce)").matches && gemerkt("animationen") !== "aus", false);
baue();
{
  const kontrolle = R.rentenluecke({ alter: A.Rentenalter, sparrateLang: sparVorschlag.lang, rendite: A.RenditeProzent, inflation: A.InflationProzent, steuersatz: A.SteuersatzAlterProzent, kaufkraft: "heute" }).lueckeHeute;
  if (F.Rentenluecke != null && Math.abs(F.Rentenluecke - kontrolle) > 5) console.warn(`Rentenlücke: DATEN.finanzstatus.Rentenluecke (${F.Rentenluecke}) weicht von der Rechnung des Artefakts (${kontrolle.toFixed(2)}) ab.`);
  const start = FOLIEN.findIndex(f => f.id === decodeURIComponent(location.hash.slice(1)));
  zeige(start >= 0 ? start : 0, { hash: false });
}
</script>
